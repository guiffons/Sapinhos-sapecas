function setupJoystick(zoneEl,baseEl,knobEl,isRight){
  let pid=null,ox=0,oy=0;
  const maxR=42;
  const onStart=e=>{
    if(pid!==null)return;
    const t=e.changedTouches?e.changedTouches[0]:e;
    pid=t.identifier??'m';
    const rect=$('touch-layer').getBoundingClientRect();
    ox=t.clientX-rect.left;oy=t.clientY-rect.top;
    baseEl.style.display='block';
    baseEl.style.left=ox+'px';baseEl.style.top=oy+'px';
    knobEl.style.transform='translate(0px,0px)';
    if(isRight){touchState.rActive=true;touchState.rx=0;touchState.ry=0}
    else{touchState.lActive=true;touchState.lx=0;touchState.ly=0}
  };
  const onMove=e=>{
    if(pid===null)return;
    const list=e.changedTouches||[e];
    for(const t of list){
      if((t.identifier??'m')===pid){
        const rect=$('touch-layer').getBoundingClientRect();
        const dx=(t.clientX-rect.left)-ox,dy=(t.clientY-rect.top)-oy;
        const d=Math.hypot(dx,dy)||1,cl=Math.min(maxR,d);
        const nx=dx/d*(cl/maxR),ny=dy/d*(cl/maxR);
        knobEl.style.transform=`translate(${(dx/d*cl).toFixed(1)}px,${(dy/d*cl).toFixed(1)}px)`;
        if(isRight){touchState.rx=d>6?nx:0;touchState.ry=d>6?ny:0}
        else{touchState.lx=d>6?nx:0;touchState.ly=d>6?ny:0}
      }
    }
  };
  const onEnd=e=>{
    if(pid===null)return;
    const list=e.changedTouches||[e];
    for(const t of list){
      if((t.identifier??'m')===pid){
        pid=null;baseEl.style.display='none';
        if(isRight){touchState.rActive=false;touchState.rx=0;touchState.ry=0}
        else{touchState.lActive=false;touchState.lx=0;touchState.ly=0}
      }
    }
  };
  zoneEl.addEventListener('touchstart',e=>{e.preventDefault();onStart(e)},{passive:false});
  zoneEl.addEventListener('touchmove',e=>{e.preventDefault();onMove(e)},{passive:false});
  zoneEl.addEventListener('touchend',e=>{e.preventDefault();onEnd(e)},{passive:false});
  zoneEl.addEventListener('touchcancel',e=>{e.preventDefault();onEnd(e)},{passive:false});
}

function T(s,x,y,c,a,sz){
  g.font='bold '+(sz||10)+'px "Trebuchet MS",monospace';
  g.textAlign=a||'left';g.lineWidth=3;g.strokeStyle='#000';g.lineJoin='round';
  g.strokeText(s,x,y);g.fillStyle=c||'#e8f5e9';g.fillText(s,x,y);
}

function dspr(s,x,y,j,al,f,sc=1,z=0,outlineCol=''){
  const h=s.height*sc,w=s.width*sc;g.save();
  const shSc=clamp(1-(z/55),0.42,1);
  g.globalAlpha=.34*shSc;g.fillStyle='#000';
  g.beginPath();g.ellipse(x,y+h/2,w*.4*shSc,3.5*sc*shSc,0,0,7);g.fill();
  g.globalAlpha=al??1;
  g.translate(x,y+h/2-z);
  if(z>2)g.rotate(Math.sin((z/24)*Math.PI)*0.22*(me.ax>=0?1:-1));
  g.scale((1+j)*sc,(1-j)*sc);
  if(outlineCol){
    const oSil=sil(s,outlineCol);
    g.drawImage(oSil,-s.width/2-1,-s.height);
    g.drawImage(oSil,-s.width/2+1,-s.height);
    g.drawImage(oSil,-s.width/2,-s.height-1);
    g.drawImage(oSil,-s.width/2,-s.height+1);
  }
  g.drawImage(s,-s.width/2,-s.height);
  if(f>0){g.globalAlpha=.92;g.drawImage(sil(s,'#fff'),-s.width/2,-s.height)}
  g.restore();
}

function drawB(b,en){
  const c=en?'#ff5252':(b.col||WP[b.w]?.col||'#76ff03'),r=b.r||4;
  if(b.tng){
    let ox=me.x,oy=me.y-6-me.z;
    if(b.oid&&b.oid!==me.id&&others[b.oid]){
      ox=others[b.oid].rx;oy=others[b.oid].ry-6-(others[b.oid].z||0);
    }
    g.strokeStyle='#ff4081';g.lineWidth=4;g.beginPath();g.moveTo(ox,oy);g.lineTo(b.x,b.y);g.stroke();
    g.strokeStyle='#ff80ab';g.lineWidth=1.5;g.beginPath();g.moveTo(ox,oy);g.lineTo(b.x,b.y);g.stroke();
  }
  if(b.shoal){
    const a=Math.atan2(b.vy,b.vx)+Math.PI;
    const tx=b.x+Math.cos(a+Math.sin(TT*28)*.4)*10,ty=b.y+Math.sin(a+Math.sin(TT*28)*.4)*10;
    g.strokeStyle=c;g.lineWidth=2;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(tx,ty);g.stroke();
  }
  g.globalCompositeOperation='lighter';g.globalAlpha=.7;g.drawImage(glow(c),b.x-r*4,b.y-r*4,r*8,r*8);
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  g.fillStyle=c;g.beginPath();g.ellipse(b.x,b.y,r*1.35,r*.9,Math.atan2(b.vy,b.vx),0,7);g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(b.x-1,b.y-1,r*.35,0,7);g.fill();
}

function hearts(x,y,hp,mh,sz,per){

function drawCrosshair(){
  if(paused)return;
  const fy=me.y-6-me.z;
  g.save();
  g.strokeStyle=WP[me.w]?.col||'#69f0ae';
  g.globalAlpha=.2;g.lineWidth=1;g.setLineDash([3,4]);
  g.beginPath();g.moveTo(me.x,fy);g.lineTo(mouse.x,mouse.y);g.stroke();
  g.setLineDash([]);
  const sc=1+(me.puff>0?0.32:0)+Math.sin(TT*8)*0.06;
  g.translate(mouse.x,mouse.y);
  g.rotate(TT*2.2);
  g.scale(sc,sc);
  g.globalAlpha=.95;
  g.drawImage(S.cross,-S.cross.width/2,-S.cross.height/2);
  g.restore();
}

function drawCamp(){

  // Portal da Masmorra no Topo (240, 48)

  g.fillStyle='#263238';g.beginPath();g.ellipse(px,py,36,20,0,0,7);g.fill();

  g.beginPath();g.ellipse(px,py,30+Math.sin(TT*6)*2,15+Math.cos(TT*6)*1.5,0,0,7);g.stroke();
  g.globalCompositeOperation='lighter';g.globalAlpha=.65+Math.sin(TT*5)*.15;
  g.drawImage(glow('#00e676'),px-38,py-38,76,76);
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  const totalPl=1+act().length;
  const inPl=[me,...act().map(o=>({x:o.rx,y:o.ry}))].filter(p=>Math.hypot(p.x-px,p.y-py)<32).length;
  T(`PORTAL DA MASMORRA (${inPl}/${totalPl})`,px,py-24,'#69f0ae','center',8.5);

  // Placa Seletora de Bioma (382, 118)
  const sx=camp.sign.x,sy=camp.sign.y;
  dspr(S.sign,sx,sy,0,1,0);
  T(`BIOMA: ${TH[camp.sign.bIdx].nm.toUpperCase()}`,sx,sy-22,'#ffd54f','center',7.5);
  if(Math.hypot(me.x-sx,me.y-sy)<30)T('[E] MUDAR BIOMA INICIAL',sx,sy+20,'#69f0ae','center',7.5);

  // Espantalho de Treino (88, 152)
  const dm=camp.dummy;
  dspr(S.dummy,dm.x,dm.y,dm.j,1,dm.fl>0?1:0,1.15);
  T('ESPANTALHO DE TREINO',dm.x,dm.y-28,'#ffe082','center',7.5);
  T(`DPS: ${dm.dps.toFixed(1)}/s`,dm.x,dm.y-18,'#ff5252','center',8.5);

  // Velho Sapo Xamã + Caldeirão Ancestral (92, 236)
  const shx=camp.shaman.x,shy=camp.shaman.y;
  g.globalCompositeOperation='lighter';g.globalAlpha=.65+Math.sin(TT*6)*.15;
  g.drawImage(glow('#00e5ff'),shx-32,shy-32,64,64);
  g.globalCompositeOperation='source-over';g.globalAlpha=1;
  dspr(S.shaman,shx,shy,Math.sin(TT*3.5)*.05,1,0,1.15);
  T('VELHO SAPO XAMÃ',shx,shy-26,'#00e5ff','center',8);
  T(`LARVAS: ${achStats.larvae}`,shx,shy-16,'#ffd54f','center',7.5);
  if(Math.hypot(me.x-shx,me.y-shy)<34){
    T('[E] ABRIR CALDEIRÃO DE UPGRADES',shx,shy+22,'#84ffff','center',8);
  }

  // Troncos com os Sapos Descansando
  const taken=new Set([me.ch,...act().map(o=>o.c)]);
  const L=[];
  for(const lg of camp.logs){
    L.push([lg.y,()=>{
      g.drawImage(S.log,lg.x-S.log.width/2,lg.y-S.log.height/2+6);
      if(!taken.has(lg.c)){
        const un=isCharUnlocked(lg.c);
        const fSpr=un?S.pIdle[lg.c]:sil(S.pIdle[lg.c],'#16241b');
        const hop=Math.sin(TT*4+lg.c)*0.04;
        dspr(fSpr,lg.x,lg.y-4,hop,1,0);
        if(!un)g.drawImage(S.lock,lg.x-S.lock.width/2,lg.y-14);
        if(Math.hypot(me.x-lg.x,me.y-lg.y)<26){
          T(un?`[E] ${CH[lg.c].n.toUpperCase()} (${WP[CH[lg.c].wp].nm})`:`BLOQUEADO: ${CH[lg.c].reqTxt}`,lg.x,lg.y-26,'#ffd54f','center',7.5);
        }
      }
    }]);
  }

  // Fogueira Central (240, 168)
  L.push([168,()=>{
    const cf=S.campfire[((TT*8)|0)%2];
    g.globalCompositeOperation='lighter';g.globalAlpha=.7+Math.sin(TT*10)*.12;
    g.drawImage(glow('#ff9100'),240-54,168-54,108,108);
    g.globalCompositeOperation='source-over';g.globalAlpha=1;
    dspr(cf,240,168,0,1,0,1.15);
  }]);

  for(const o of act())L.push([o.ry,()=>{
    const cIdx=o.c||0;
    const oSpr=o.puff?S.pPuff[cIdx]:(o.wf?S.pWalk[cIdx]:S.pIdle[cIdx]);
    dspr(oSpr,o.rx,o.ry,o.j||0,1,0,1,o.z||0,'#fff');
    T(CH[cIdx].n,o.rx,o.ry-30-(o.z||0),'#80cbc4','center',7.5);
  }]);

  L.push([me.y,()=>{
    const mySpr=me.puff>0?S.pPuff[me.ch]:(me.wf?S.pWalk[me.ch]:S.pIdle[me.ch]);
    dspr(mySpr,me.x,me.y,me.j,1,0,1,me.z,'#fff');
    drawFrogExtras(me.x,me.y,me.z,me.fly,me.sh,me.fam,me.clone,me.its.length,me.ch);
  }]);

  L.sort((a,b)=>a[0]-b[0]);for(const l of L)l[1]();

  for(const bm of BEAMS){
    const ex=bm.x+Math.cos(bm.a)*480,ey=bm.y+Math.sin(bm.a)*480,al=bm.l/bm.m;

    g.strokeStyle='#fff';g.lineWidth=bm.w*.65;g.beginPath();g.moveTo(bm.x,bm.y);g.lineTo(ex,ey);g.stroke();
    g.restore();
  }
  for(const b of myB.concat(rB))drawB(b);
  drawP();
  for(const f of FT){g.globalAlpha=clamp(f.l*2,0,1);T(f.s,f.x,f.y,f.c,'center',f.b?10:8.5)}
  g.globalAlpha=1;
  g.drawImage(VIG,0,0);
  drawCrosshair();

  T('ACAMPAMENTO · VISITE O SAPO XAMÃ [E], TROQUE DE SAPO OU ENTRE NO PORTAL',240,14,'#ffd54f','center',8);
  T(`SAPO: ${CH[me.ch].n.toUpperCase()} · LARVAS: ${achStats.larvae} · MOSCAS INICIAIS: ${me.gold}`,240,H-8,'#a5d6a7','center',7.5);
}

function drawDoor4(dir,cell){
  if(!cell||!cell.doors[dir])return;
  const o=wd.clear;
  let nx=cell.gx,ny=cell.gy;
  if(dir==='N')ny--;else if(dir==='S')ny++;else if(dir==='W')nx--;else if(dir==='E')nx++;
  const nb=wd.grid?.[ny]?.[nx];
  const isBoss=nb?.type==='boss';
  const isLocked=nb?.locked;
  const col=isBoss?'#ff1744':(isLocked?'#ffd54f':(o?'#69f0ae':'#ff5252'));

  if(dir==='N'||dir==='S'){
    const dy=dir==='N'?0:H-M;
    g.fillStyle=o?'#050a07':'#261914';g.fillRect(220,dy,40,M);
    g.fillStyle=col;g.fillRect(220,dir==='N'?M-3:H-M,40,3);
    if(!o){g.fillStyle='#140d0a';for(let i=0;i<4;i++)g.fillRect(226+i*8,dy+2,3,M-4)}
    if(isBoss)g.drawImage(S.skull,240-S.skull.width/2,dy+8);
    else if(isLocked)g.drawImage(S.lock,240-S.lock.width/2,dy+8);
  }else{
    const dx=dir==='W'?0:W-M;
    g.fillStyle=o?'#050a07':'#261914';g.fillRect(dx,140,M,40);
    g.fillStyle=col;g.fillRect(dir==='W'?M-3:W-M,140,3,40);
    if(!o){g.fillStyle='#140d0a';for(let i=0;i<4;i++)g.fillRect(dx+2,146+i*8,M-4,3)}
    if(isBoss)g.drawImage(S.skull,dx+8,160-S.skull.height/2);
    else if(isLocked)g.drawImage(S.lock,dx+8,160-S.lock.height/2);
  }
}

function drawMinimap(){
  if(!wd||!wd.grid)return;
  const mx=W-62,my=26,sz=9,gap=2;
  g.fillStyle='#050c08cc';
  g.fillRect(mx-4,my-4,5*(sz+gap)+6,5*(sz+gap)+6);
  g.strokeStyle='#4caf50';g.lineWidth=1;
  g.strokeRect(mx-4,my-4,5*(sz+gap)+6,5*(sz+gap)+6);

  for(let y=0;y<5;y++)for(let x=0;x<5;x++){
    const c=wd.grid[y][x];if(!c.active)continue;
    const adjVis=[[0,-1],[0,1],[-1,0],[1,0]].some(([dx,dy])=>wd.grid[y+dy]?.[x+dx]?.vis);
    if(!c.vis&&!adjVis)continue;
    const rx=mx+x*(sz+gap),ry=my+y*(sz+gap);
    const isCur=(x===wd.gx&&y===wd.gy);
    g.fillStyle=isCur?'#ffd54f':(c.vis?(c.clear?'#43a047':'#ef5350'):'#263238');
    g.fillRect(rx,ry,sz,sz);
    if(c.type==='boss')T('B',rx+4.5,ry+7.5,'#ff1744','center',6.5);
    else if(c.type==='shop')T('$',rx+4.5,ry+7.5,'#ffd54f','center',6.5);
    else if(c.type==='treasure')T('★',rx+4.5,ry+7.5,'#29b6f6','center',6.5);
  }
}

function draw(){
  g.setTransform(Z,0,0,Z,0,0);
  if(ST=='menu'){drawMenuBG();return}
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  g.setTransform(Z,0,0,Z,(Math.random()-.5)*shake*Z,(Math.random()-.5)*shake*Z);
  if(ST=='camp'){drawCamp();return}

  const cell=curCell();if(!cell)return;
  const th=TH[wd.bIdx];
  g.drawImage(bg(),0,0);

  const hz=hazards();
  for(const w of hz.water){
    g.strokeStyle=th.a;g.globalAlpha=.25+Math.sin(TT*4)*0.08;g.lineWidth=1.2;
    g.beginPath();g.ellipse(w.x,w.y,w.rx*(.7+Math.sin(TT*2)*.1),w.ry*(.7+Math.cos(TT*2)*.1),0,0,7);g.stroke();
  }
  g.globalAlpha=1;
  const isUp=spikesUp(),isWrn=spikesWarn();
  for(const spk of hz.spikes){
    if(isWrn){g.fillStyle='#ff174455';g.fillRect(spk.x-12,spk.y-12,24,24)}
    const spSpr=S.spike[isUp?1:0];
    g.drawImage(spSpr,spk.x-spSpr.width/2,spk.y-spSpr.height/2);
  }

  for(const d of DC){g.globalAlpha=.45;g.fillStyle=d.c;g.beginPath();g.ellipse(d.x,d.y,d.r,d.r*.55,0,0,7);g.fill()}
  for(const pl of POOLS){
    g.globalAlpha=clamp(pl.l,.2,.65);g.fillStyle=pl.c;
    g.beginPath();g.ellipse(pl.x,pl.y,pl.r+Math.sin(TT*10)*2,(pl.r+Math.cos(TT*10)*2)*.6,0,0,7);g.fill();
  }
  g.globalAlpha=1;

  drawDoor4('N',cell);drawDoor4('S',cell);drawDoor4('W',cell);drawDoor4('E',cell);

  if(wd.trapdoor){
    g.fillStyle='#050a07';g.beginPath();g.arc(240,135,18,0,7);g.fill();
    g.strokeStyle='#ffd54f';g.lineWidth=2.5;g.beginPath();g.arc(240,135,18+Math.sin(TT*6)*1.5,0,7);g.stroke();
    T('ALÇAPÃO ABERTO · PISE PARA O PRÓXIMO BIOMA!',240,110,'#69f0ae','center',8);
  }

  // Totem de Desafio Co-op / Elite Wave (Ideia C)
  if(cell.type==='combat'&&cell.totem){
    const tm=cell.totem;
    dspr(S.totem,tm.x,tm.y,Math.sin(TT*5)*(tm.state===1?.08:0),1,tm.state===1?1:0,1.2);
    if(tm.state===0&&wd.clear&&Math.hypot(me.x-tm.x,me.y-tm.y)<30){
      T('[E] ATIVAR TOTEM DE RISCO (ONDA ELITE = BAÚ + LARVA)',tm.x,tm.y-24,'#ff5252','center',7.5);
    }
  }

  if(cell.type==='combat'&&act().length>0&&cell.coopChest&&!cell.coopChest.spawned){
    for(const px of [M+44,W-M-44]){
      const py=H-M-36;
      g.fillStyle='#263238';g.fillRect(px-11,py-8,22,16);
      g.fillStyle='#ffd54f';g.fillRect(px-8,py-5,16,10);
    }
    if(wd.clear)T('PISEM JUNTOS NOS 2 PEDAIS DOURADOS!',240,H-M-12,'#ffd54f','center',7.5);
  }

  const tFrame=S.torch[((TT*8)|0)%2];
  const corners=[[M+8,M+8],[W-M-8,M+8],[M+8,H-M-10],[W-M-8,H-M-10]];
  g.globalCompositeOperation='lighter';
  for(const [x,y] of corners){g.globalAlpha=.5+Math.sin(TT*9+x)*.14;g.drawImage(glow('#ff9100'),x-38,y-38,76,76)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  for(const [x,y] of corners)g.drawImage(tFrame,x-tFrame.width/2,y-tFrame.height/2);

  if(cell.type==='shop'&&cell.shop){
    dspr(S.merchant,240,104,Math.sin(TT*4)*.05,1,0,1.25);
    T('MERCADOR DO PÂNTANO',240,74,'#ffd54f','center',8.5);
    const soloDisc=act().length===0?0.85:1.0;
    cell.shop.forEach((s,idx)=>{
      g.fillStyle='#455a64';g.fillRect(s.x-12,s.y+5,24,7);
      g.fillStyle='#78909c';g.fillRect(s.x-14,s.y+3,28,3);
      if(s.sold){T('ESGOTADO',s.x,s.y-4,'#78909c','center',7);return}
      const isSoloAnkh=(idx===2&&act().length===0&&me.ankh===0);
      const price=Math.max(1,Math.round((isSoloAnkh?24:s.cost)*soloDisc));
      const by=Math.sin(TT*4+s.x)*2.5;
      let ic=S.h,col='#ffd54f',nm=s.nm,ds=s.ds,affTag='';
      if(s.t==='key')ic=S.key;
      else if(isSoloAnkh){ic=S.ankh;col='#00e676';nm='OVA DE RENASCIMENTO';ds='Revive 1x no Solo'}
      else if(s.k!=null){
        ic=S.items[s.k];
        const rar=RAR_INFO[IT[s.k][2]];
        col=rar.col;nm=IT[s.k][0];ds=IT[s.k][1];
        if(isItemAffinity(s.k,me.ch))affTag=' ★AFINIDADE!';
      }
      g.globalCompositeOperation='lighter';g.globalAlpha=.65;g.drawImage(glow(col),s.x-22,s.y-24+by,44,44);
      g.globalCompositeOperation='source-over';g.globalAlpha=1;
      g.drawImage(ic,s.x-ic.width/2,s.y-18+by);
      T(`${price} MOSCAS`,s.x,s.y+22,'#ffd54f','center',7.5);
      if(Math.hypot(me.x-s.x,me.y-s.y)<24){
        T(`[E] ${nm}${affTag}`,s.x,s.y-28,affTag?'#00e5ff':col,'center',8);
        T(ds,s.x,s.y-19,'#e8f5e9','center',7);
      }
    });
  }

  for(const chObj of [cell.chest,cell.coopChest]){
    if(chObj&&(chObj===cell.chest||chObj.spawned)){
      const rar=RAR_INFO[IT[chObj.k][2]];
      const isAff=isItemAffinity(chObj.k,me.ch);
      g.globalCompositeOperation='lighter';g.globalAlpha=.75;g.drawImage(glow(rar.col),chObj.x-26,chObj.y-26,52,52);
      g.globalCompositeOperation='source-over';g.globalAlpha=1;
      const cSpr=S.chest[chObj.open?1:0];
      dspr(cSpr,chObj.x,chObj.y,0,1,0,1.2);
      if(!chObj.open)T(`[E] ABRIR BAÚ (${rar.nm}${isAff?' · ★AFINIDADE':''})`,chObj.x,chObj.y+24,isAff?'#00e5ff':rar.col,'center',8);
    }
  }

  const flySpr=S.flyGold[((TT*14)|0)%2];
  for(const f of FLIES)dspr(flySpr,f.x,f.y,0,1,0,0.9,f.z);
  for(const lv of LARVAE){
    g.globalCompositeOperation='lighter';g.globalAlpha=.65;g.drawImage(glow('#00e5ff'),lv.x-18,lv.y-18-lv.z,36,36);
    g.globalCompositeOperation='source-over';g.globalAlpha=1;
    dspr(S.larva,lv.x,lv.y,0,1,0,1.0,lv.z);
  }
  for(const dr of DROPS){
    const by=Math.sin(TT*6+dr.id)*2.5;
    dspr(dr.t==='key'?S.key:S.h,dr.x,dr.y+by,dr.j,1,0);
  }

  // Entidades Ordenadas por Profundidade (Pilares 2.5D, Mesas, Props, Inimigos e Sapos)
  const L=[];
  const obSpr=S.obs[th.ob];
  for(const k of rocks())L.push([k.y+28,()=>{
    // Sombra e Face Frontal 2.5D nos Pilares
    g.fillStyle='#0007';g.fillRect(k.x+2,k.y+24,28,8);
    g.fillStyle='#0a120d';g.fillRect(k.x+2,k.y+18,28,9);
    g.drawImage(obSpr,k.x+2,k.y+2,28,24);
  }]);

  for(const tb of TABLES)if(tb.hp>0)L.push([tb.y+8,()=>{
    const tSpr=tb.flip?S.tableFlipped:S.tableIntact;
    dspr(tSpr,tb.x,tb.y,tb.j,1,tb.fl>0?1:0,1.1);
    if(!tb.flip&&Math.hypot(me.x-tb.x,me.y-tb.y)<26){
      T('[E] CHUTAR MESA',tb.x,tb.y-18,'#ffe082','center',7);
    }
  }]);

  for(const pr of PROPS)if(!pr.dead)L.push([pr.y+6,()=>{
    dspr(S[pr.t]||S.barrel,pr.x,pr.y,0,1,0,1.0);
  }]);

  for(const e of wd.en)L.push([e.y,()=>{
    const bo=e.t.startsWith('B'),p2=bo&&e.hp<e.mh*.5;
    const animF=((Math.floor(TT*7+e.id))%2)===1;
    const s=bo?(p2?S[e.t+'_2']:(animF&&S[e.t+'_f2']?S[e.t+'_f2']:S[e.t])):(animF&&S[e.t+'_f2']?S[e.t+'_f2']:S[e.t]);
    const hop=(e.t=='m'||e.t=='n'||e.t=='B0')?Math.abs(Math.sin(TT*3.8+e.id))*.22-.08:0;
    const id=Math.sin(TT*6+e.id)*.05,tel=e.tel>0&&Math.floor(TT*20)%2;
    const al=e.t=='gho'?(.35+Math.sin(TT*5+e.id)*.25):1;
    const sc=e.chmp?1.28:1;

    if(e.chmp||e.chemT>0){
      g.globalCompositeOperation='lighter';g.globalAlpha=.55+Math.sin(TT*8)*.15;
      g.drawImage(glow(e.chemT>0?'#00e5ff':'#ffd54f'),(e.rx??e.x)-24,e.y-24,48,48);
      g.globalCompositeOperation='source-over';g.globalAlpha=1;
    }
    if(e.seg){
      for(let i=e.seg.length-1;i>=0;i--){
        const sg=e.seg[i];
        dspr(animF?S.m_f2:S.m,sg.x,sg.y,0,.9,e.fl>0?1:0);
      }
    }
    dspr(s,e.rx??e.x,e.y+(e.t=='f'||e.t=='B1'?Math.sin(TT*10+e.id)*3-6:0),e.j+id-hop,al,e.fl>0||tel?1:0,sc);
    if(bo){
      const cy=e.y-s.height-10+Math.sin(TT*6)*2;
      g.drawImage(S.crown,(e.rx??e.x)-S.crown.width/2,cy);
    }
  }]);

  for(const o of act())L.push([o.ry,()=>{
    const cIdx=o.c||0;
    const oSpr=o.puff?S.pPuff[cIdx]:(o.wf?S.pWalk[cIdx]:S.pIdle[cIdx]);
    const flyZ=(o.z||0)+(o.fly?Math.sin(TT*7+1)*4+4:0);
    const oAl=o.d?.42:(o.inv&&Math.floor(TT*14)%2?.4:1);
    const oSc=(o.ic||0)>=5?1.12:1;
    if(o.d){
      g.strokeStyle='#00e5ff66';g.lineWidth=2;
      g.beginPath();g.arc(o.rx,o.ry,34,0,7);g.stroke();
      const rp=Math.max(me.revP||0,o.revP||0);
      if(rp>0){
        g.strokeStyle='#00e676';g.lineWidth=3.5;
        g.beginPath();g.arc(o.rx,o.ry,34,-1.57,-1.57+rp*6.283);g.stroke();
      }
      T('FIQUE NO CÍRCULO P/ REANIMAR (3s)',o.rx,o.ry+24,'#00e676','center',7.5);
    }else if(o.hp===1&&me.hp>=4&&Math.hypot(me.x-o.rx,me.y-o.ry)<30){
      T('[E] DOAR 1 CORAÇÃO AO AMIGO',o.rx,o.ry-38,'#ff80ab','center',7.5);
    }
    dspr(oSpr,o.rx,o.ry,o.j||0,oAl,0,oSc,flyZ,'#fff');
    drawFrogExtras(o.rx,o.ry,flyZ,o.fly,o.sh,o.fam,0,o.ic||0,cIdx);
    T(CH[cIdx].n,o.rx,o.ry-30-flyZ,'#80cbc4','center',7);
    if(o.d)g.drawImage(S.skull,o.rx-S.skull.width/2,o.ry-24);
  }]);

  L.push([me.y,()=>{
    const mySpr=me.puff>0?S.pPuff[me.ch]:(me.wf?S.pWalk[me.ch]:S.pIdle[me.ch]);
    const flyZ=me.z+(me.fly?Math.sin(TT*7)*4+4:0);
    const mySc=(me.its.length>=5||Object.keys(me.syn||{}).length>0)?1.12:1;
    if(me.dead&&act().length>0){
      g.strokeStyle='#00e5ff88';g.lineWidth=2;
      g.beginPath();g.arc(me.x,me.y,34,0,7);g.stroke();
      T('AGUARDANDO PARCEIRO NO CÍRCULO...',me.x,me.y+24,'#00e5ff','center',7.5);
    }
    dspr(mySpr,me.x,me.y,me.j,me.dead?.42:((me.inv>0||me.z>6)&&Math.floor(TT*16)%2?.55:1),fl>.6?1:0,mySc,flyZ,'#fff');
    drawFrogExtras(me.x,me.y,flyZ,me.fly,me.sh,me.fam,me.clone,me.its.length,me.ch);
    if(me.dead)g.drawImage(S.skull,me.x-S.skull.width/2,me.y-24);
  }]);

  L.sort((a,b)=>a[0]-b[0]);for(const l of L)l[1]();

  for(const arc of ARCS){
    g.strokeStyle='#00e5ff';g.lineWidth=2;
    g.beginPath();g.moveTo(arc.x1,arc.y1);
    g.lineTo((arc.x1+arc.x2)/2+(Math.random()-.5)*14,(arc.y1+arc.y2)/2+(Math.random()-.5)*14);
    g.lineTo(arc.x2,arc.y2);g.stroke();
  }

  for(const bm of BEAMS){
    const ex=bm.x+Math.cos(bm.a)*480,ey=bm.y+Math.sin(bm.a)*480,al=bm.l/bm.m;
    g.save();g.globalAlpha=al;g.lineCap='round';
    g.strokeStyle=bm.col;g.lineWidth=bm.w*1.8;g.beginPath();g.moveTo(bm.x,bm.y);g.lineTo(ex,ey);g.stroke();
    g.strokeStyle='#fff';g.lineWidth=bm.w*.65;g.beginPath();g.moveTo(bm.x,bm.y);g.lineTo(ex,ey);g.stroke();
    g.restore();
  }

  for(const b of wd.eb)drawB(b,1);
  for(const b of myB.concat(rB))drawB(b);
  drawP();
  for(const f of FT){g.globalAlpha=clamp(f.l*2,0,1);T(f.s,f.x,f.y,f.c,'center',f.b?10.5:8.5)}
  g.globalAlpha=1;
  g.drawImage(VIG,0,0);
  if(fl>0){g.fillStyle='rgba(255,20,40,'+fl*.28+')';g.fillRect(0,0,W,H)}

  // HUD OVERLAY (CORAÇÕES, MOSCAS, CHAVES, LARVAS CRISTALIZADAS E MINIMAPA)
  hearts(8,8,me.hp,me.mh,14,8);
  let icX=8;
  if(me.sh>0){g.drawImage(S.sh,icX,25,13,13);icX+=16}
  if(me.ankh>0){g.drawImage(S.ankh,icX,25,13,13);icX+=16}

  g.drawImage(S.flyGold[0],8,42,12,10);
  T(`${me.gold}`,23,51,'#ffd54f','left',9);
  g.drawImage(S.key,48,41,11,11);
  T(`${me.keys}`,62,51,'#fff59d','left',9);
  g.drawImage(S.larva,84,41,11,11);
  T(`${achStats.larvae}`,98,51,'#00e5ff','left',9);

  const rmTitle=cell.type==='boss'?'COVIL DO CHEFE':cell.type==='shop'?'LOJA DO MERCADOR':cell.type==='treasure'?'SALA DE MUTAÇÃO':cell.type==='start'?'CLAREIRA INICIAL':LAYOUT_NMS[cell.lay];
  T(`${th.nm.toUpperCase()} (BIOMA ${wd.bIdx+1}/5) · ${rmTitle}`,240,12,'#a5d6a7','center',8);

  drawMinimap();

  const ot=act()[0];
  if(ot){
    T(`${CH[ot.c||0].n} (${ot.gold||0}$)`,W-72,14,'#80cbc4','right',8);
    hearts(W-72-(ot.mh||6)*8,17,ot.hp,ot.mh||6,7,10);
  }

  const w=WP[me.w];
  const synCnt=Object.keys(me.syn||{}).length;
  const evoStg=me.its.length>=5?'APEX':(me.its.length>=3?'MUTANTE':'BASE');
  T(`${w.nm} · DANO:${me.dm.toFixed(1)} · ESTÁGIO:${evoStg} · PULO-Z:${me.jumpCd>0?'RECARG.':'PRONTO'}${synCnt?` · SINERGIAS:${synCnt}`:''}`,8,H-7,w.col,'left',8);
  me.its.slice(-14).forEach((k,idx)=>{
    g.drawImage(S.items[k],8+idx*16,H-26,14,14);
  });

  const boss=wd.en.find(e=>e.t.startsWith('B'));
  if(boss){
    g.fillStyle='#000c';g.fillRect(130,22,220,9);
    g.fillStyle='#ff1744';g.fillRect(132,24,216*clamp(boss.hp/boss.mh,0,1),5);
    g.drawImage(S.crownSm,114,19);
    T(BOSS_NMS[boss.t]||'CHEFE',240,38,'#ffd54f','center',8);
  }

  if(hint>0)T('WASD move · MOUSE 360° atira · ESPAÇO/Botão Dir salta · E vira mesas/interage',240,H-32,'#b0bec5','center',7.5);

  if(wd.over||lost()){
    g.fillStyle='#000c';g.fillRect(0,100,W,105);
    T(wd.over?'PÂNTANO CONQUISTADO!':'FIM DA LINHA, SAPINHO!',240,145,wd.over?'#69f0ae':'#ff5252','center',22);
    T('Pressione R para nova run ou botão ACAMP. no topo para gastar suas Larvas no Xamã!',240,174,'#ffd54f','center',9);
  }

  drawCrosshair();
  if(tr>0){g.fillStyle='rgba(0,0,0,'+tr+')';g.fillRect(0,0,W,H)}
}

// =============================================================================
// GAME LOOP PRINCIPAL
// =============================================================================
let last=now();
(function loop(){
  const n=now();let dt=Math.min(.05,(n-last)/1000);last=n;const rdt=dt;
  if(hs>0){hs-=dt;dt*=.2}
  if(ST=='play'||ST=='camp')upd(dt,rdt);
  else if(Math.random()<.45)P.push({x:Math.random()*W,y:H+5,vx:(Math.random()-.5)*15,vy:-25-Math.random()*35,l:5,m:5,c:Math.random()<.5?'#69f0ae':'#ffd54f',s:2+Math.random()*2,g:0});
  partsUpd(dt);draw();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
