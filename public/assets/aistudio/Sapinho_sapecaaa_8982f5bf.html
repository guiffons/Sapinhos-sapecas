<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SAPINHOS SAPECAS — ROGUELITE EDITION</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#040806;--fg:#e8f5e9;--gold:#ffd54f;--accent:#43a047;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{
  width:100vw;height:100vh;height:100dvh;margin:0;padding:0;
  background:#040806;color:var(--fg);
  font-family:"Trebuchet MS",Verdana,sans-serif;
  overflow:hidden;touch-action:none;
}
#wrap{
  position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(10px,1.65vmin,22px);
}
canvas#c{
  width:100vw;height:100vh;height:100dvh;
  object-fit:cover;image-rendering:pixelated;display:block;
}
canvas#c.fit-aspect{
  width:min(100vw,calc(100dvh * 1.5));
  height:min(100dvh,calc(100vw / 1.5));
  border-radius:.5em;
  box-shadow:0 0 3em #000,0 0 0 .2em #2e573c;
  object-fit:fill;
}

/* MENU INDIE PROFISSIONAL */
#menu{
  position:absolute;inset:0;display:flex;flex-direction:row;
  align-items:center;justify-content:space-evenly;
  padding:calc(var(--sat) + 2em) calc(var(--sar) + 2em) calc(var(--sab) + 2em) calc(var(--sal) + 2em);
  background:radial-gradient(circle at 50% 50%,#12281cbb 0%,#040906f9 100%);
  z-index:20;flex-wrap:wrap;gap:2em;
}
#menu-left{
  display:flex;flex-direction:column;align-items:center;flex:1;min-width:20em;
}
#menu-right{
  display:flex;flex-direction:column;align-items:stretch;gap:1.2em;flex:1;min-width:18em;
  max-width:22em;
}
#title-box{text-align:center;margin-bottom:1em;}
h1{
  margin:0;font:900 3.8em "Arial Black",Impact,sans-serif;letter-spacing:.02em;
  color:#b9f6ca;
  -webkit-text-stroke: 0.04em #000;
  text-shadow:0 .08em 0 #fff, 0 .15em 0 #2e7d32, 0 .25em 0 #000, 0 0 1.5em #4caf50aa;
}
h1 span{display:inline-block;transform-origin:50% 100%;animation:jel 1.7s ease-in-out infinite;animation-delay:calc(var(--i)*.09s)}
@keyframes jel{0%,100%{transform:scale(1,1)} 25%{transform:scale(1.15,.82)} 50%{transform:scale(.88,1.15) translateY(-.08em)} 75%{transform:scale(1.06,.94)}}
.sub{margin:-.2em 0 0;color:#a5d6a7;font-size:1.1em;font-weight:900;text-shadow:0 .15em .25em #000;letter-spacing:.08em;background:#00000066;padding:.4em .8em;border-radius:1em;}

/* 2.5D Carousel + Inspector Card */
#wheel-area{position:relative;width:100%;height:16em;display:flex;align-items:center;justify-content:center;margin-bottom:1em;}
#carousel{position:relative;width:100%;height:100%;perspective:800px}
.frog-slot{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  cursor:pointer;transition:transform .35s cubic-bezier(.25,1.5,.5,1),opacity .25s,filter .25s;
  display:flex;flex-direction:column;align-items:center;
}
.frog-slot canvas{image-rendering:pixelated;animation:jel 1.5s infinite;transform-origin:50% 100%;filter:drop-shadow(0 .3em .3em #000a)}
.frog-slot .slot-ped{
  width:5.5em;height:1.4em;background:radial-gradient(ellipse at center,#4e6e58 0%,#233629 70%,#111a14 100%);
  border:.15em solid #769c82;border-radius:50%;margin-top:-.4em;box-shadow:0 .4em .6em #000b;transition:all .25s;
}
.frog-slot.active canvas{filter:drop-shadow(0 0 .5em #fff) drop-shadow(0 .4em .4em #000a);}
.frog-slot.active .slot-ped{background:radial-gradient(ellipse at center,#ffd54f 0%,#c79100 75%,#5c4300 100%);border-color:#fff59d;box-shadow:0 0 1.8em #ffd54f99}

.nav-arrow{
  background:linear-gradient(180deg,#264a33 0%,#172e1f 100%);border:.18em solid #66bb6a;color:#e8f5e9;
  width:3.8em;height:3.8em;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 .3em 0 #0d1c12,0 .5em 1em #000a;z-index:10;transition:transform .2s cubic-bezier(.3,2.2,.5,1),background .2s;
}
.nav-arrow canvas{width:1.8em;height:1.8em;image-rendering:pixelated}
.nav-arrow:hover{transform:scale(1.1);background:linear-gradient(180deg,#336344 0%,#1f3d2a 100%);border-color:#ffd54f}
.nav-arrow:active{transform:translateY(.25em);box-shadow:0 .05em 0 #0d1c12}

#char-info{
  width:100%;max-width:24em;background:linear-gradient(160deg,#122419f2 0%,#0b1710f5 100%);
  border:.18em solid #4caf50;border-radius:1em;padding:.8em 1em;text-align:left;
  box-shadow:0 .6em 1.6em #000c,inset 0 0 1em #43a04733;z-index:8;
}
#ci-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.15em solid #294c36;padding-bottom:.3em;margin-bottom:.4em}
#ci-name{font:900 1.4em "Arial Black",sans-serif;color:#ffd54f;text-shadow:0 .08em 0 #000}
#ci-title{font-size:.85em;color:#81c784;font-style:italic}
.ci-row{font-size:.88em;margin:.25em 0;color:#dcedc8}
.ci-row b{color:#80cbc4}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3em .8em;margin-top:.4em}
.stat-item{display:flex;align-items:center;justify-content:space-between;font-size:.8em;color:#b0bec5;font-weight:700}
.stat-bars{display:flex;gap:.15em}
.stat-bars i{width:.5em;height:.7em;background:#1c2b22;border:.06em solid #2e4738;border-radius:.12em;display:inline-block}
.stat-bars i.on{background:#66bb6a;border-color:#b9f6ca;box-shadow:0 0 .4em #66bb6a88}
.stat-bars i.on.gold{background:#ffd54f;border-color:#fff9c4;box-shadow:0 0 .4em #ffd54f88}
#ci-lock{margin-top:.4em;padding:.3em .5em;background:#3e1616dd;border:.15em solid #ef5350;border-radius:.5em;color:#ffcdd2;font-size:.8em;font-weight:800;display:none;text-align:center;}

/* Big Mobile-Friendly Buttons */
button.btn{
  font:900 1.1em "Arial Black",sans-serif;color:#fff;
  background:linear-gradient(180deg,#4caf50 0%,#2e7d32 100%);
  border:.15em solid #81c784;border-radius:.8em;padding:.7em 1.2em;
  cursor:pointer;box-shadow:0 .3em 0 #1b5e20,0 .5em .8em #000b;
  transition:transform .2s cubic-bezier(.3,2.2,.5,1),filter .15s;
  display:flex;align-items:center;justify-content:center;gap:.5em;text-shadow:0 .1em 0 #0008;
}
button.btn canvas{width:1.4em;height:1.4em;image-rendering:pixelated;flex-shrink:0}
button.btn:hover{transform:scale(1.04,.96);filter:brightness(1.15)}
button.btn:active{transform:translateY(.25em);box-shadow:0 0 0 #1b5e20}
button.btn:disabled{background:#37474f;border-color:#546e7a;box-shadow:0 .2em 0 #263238;opacity:.55;cursor:not-allowed;transform:none;filter:none}

.coop-panel{
  background:#09140d;border:.18em solid #4caf50;border-radius:.8em;
  padding:.8em;display:flex;flex-direction:column;gap:.6em;box-shadow:inset 0 0 1em #000a;
}
.coop-panel span{font-size:.85em;color:#a5d6a7;font-weight:900;text-align:center;}
.coop-row{display:flex;gap:.5em;}
input#code{
  flex:1;width:100%;font:900 1.1em monospace;text-align:center;text-transform:lowercase;
  background:#000;color:#ffd54f;border:.15em solid #81c784;border-radius:.6em;padding:.5em;
}
#go{flex:2;background:linear-gradient(180deg,#7e57c2 0%,#4527a0 100%);border-color:#b39ddb;box-shadow:0 .3em 0 #281566,0 .5em .8em #000b}
#btn-ach{background:linear-gradient(180deg,#ffa000 0%,#e65100 100%);border-color:#ffe082;box-shadow:0 .3em 0 #8c3100,0 .5em .8em #000b}
#btn-opt{background:linear-gradient(180deg,#26a69a 0%,#00695c 100%);border-color:#80cbc4;box-shadow:0 .3em 0 #003d33,0 .5em .8em #000b}
#btn-shaman{background:linear-gradient(180deg,#00acc1 0%,#006064 100%);border-color:#84ffff;box-shadow:0 .3em 0 #00363a;}

.wallet-box{
  position:absolute;top:calc(var(--sat) + 1em);left:calc(var(--sal) + 1em);
  background:#000a;border:.15em solid #00e5ff;border-radius:.8em;padding:.4em .8em;
  display:flex;align-items:center;gap:.5em;font:900 1.2em monospace;color:#00e5ff;box-shadow:0 0 1em #00e5ff44;
}
.wallet-box canvas{width:1.5em;height:1.5em;image-rendering:pixelated;}

/* Modals */
.modal-box{
  position:absolute;inset:2em;max-width:40em;margin:auto;
  background:linear-gradient(160deg,#0d1b13fa 0%,#07100bfa 100%);
  border:.25em solid #ffd54f;border-radius:1em;z-index:35;
  display:none;flex-direction:column;padding:1.2em;box-shadow:0 0 5em #000f;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:.15em solid #2e573c;padding-bottom:.6em;margin-bottom:.8em}
.modal-head h2{margin:0;font:900 1.5em "Arial Black",sans-serif;color:#ffd54f;display:flex;align-items:center;gap:.4em;}
.modal-head h2 canvas{width:1.5em;height:1.5em;image-rendering:pixelated}

/* Shaman Upgrades Modal */
#shaman-modal{border-color:#00e5ff;}
#shaman-modal .modal-head h2{color:#00e5ff;}
.shaman-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.6em;padding-right:.4em;}
.upg-card{display:flex;align-items:center;justify-content:space-between;background:#091610;border:.15em solid #00acc1;border-radius:.6em;padding:.6em .8em;}
.upg-info{flex:1;}
.upg-info b{display:block;font-size:.95em;color:#e0f7fa;}
.upg-info small{display:block;font-size:.75em;color:#80cbc4;}
.upg-lvl{display:flex;gap:.2em;margin-top:.3em;}
.upg-lvl i{width:.6em;height:.6em;background:#000;border:.1em solid #00acc1;border-radius:50%;}
.upg-lvl i.on{background:#00e5ff;box-shadow:0 0 .4em #00e5ff;}
.btn-buy{background:linear-gradient(180deg,#00acc1 0%,#006064 100%);border-color:#84ffff;font-size:.8em;padding:.5em .8em;}

/* Touch Controls Mobile */
#touch-layer{position:absolute;inset:0;z-index:25;pointer-events:none;display:none}
#touch-layer.active{display:block}
.touch-zone{position:absolute;top:3em;bottom:0;width:50%;pointer-events:auto;touch-action:none}
#tz-left{left:0} #tz-right{right:0}
.joy-base{position:absolute;width:7em;height:7em;margin:-3.5em 0 0 -3.5em;border-radius:50%;background:radial-gradient(circle,#4caf5022 0%,#10221688 80%);border:.18em solid #81c78488;display:none;pointer-events:none;box-shadow:0 0 1em #0008;}
.joy-knob{position:absolute;left:50%;top:50%;width:3em;height:3em;margin:-1.5em 0 0 -1.5em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff59d 0%,#ffd54f 55%,#c79100 100%);border:.15em solid #fff;box-shadow:0 .3em .6em #000b;}
#joy-r.joy-base{border-color:#ff80ab88;background:radial-gradient(circle,#ff408122 0%,#26101988 80%)}
#joy-r .joy-knob{background:radial-gradient(circle at 35% 35%,#ff80ab 0%,#ff4081 60%,#ad1457 100%)}

.mob-act-btn{
  position:absolute;pointer-events:auto;touch-action:none;
  width:5em;height:5em;border-radius:50%;font:900 .85em "Arial Black",sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 .3em 0 #0a140e,0 .5em 1em #000b;cursor:pointer;
}
#btn-jump{right:calc(var(--sar) + 1.5em);bottom:calc(var(--sab) + 9em);background:linear-gradient(180deg,#29b6f6 0%,#0277bd 100%);border:.18em solid #b3e5fc;}
#btn-act{right:calc(var(--sar) + 7.5em);bottom:calc(var(--sab) + 2.5em);background:linear-gradient(180deg,#ffb300 0%,#e65100 100%);border:.18em solid #ffe082;}
.mob-act-btn:active{transform:scale(.92) translateY(.3em);box-shadow:0 0 0 #0a140e;}

#hud-top-btns{position:absolute;top:calc(var(--sat) + .5em);right:calc(var(--sar) + .5em);display:none;gap:.5em;z-index:26;}
#hud-top-btns.active{display:flex}
.hud-ibtn{background:#122419cc;border:.15em solid #66bb6a;border-radius:.6em;padding:.4em .6em;cursor:pointer;display:flex;align-items:center;gap:.3em;color:#e8f5e9;font:900 .8em "Arial Black",sans-serif;box-shadow:0 .2em 0 #0a140e;pointer-events:auto;}
.hud-ibtn canvas{width:1.4em;height:1.4em;image-rendering:pixelated}
.hud-ibtn:active{transform:translateY(.2em)}

/* Toast */
#steam-toast{
  position:absolute;right:calc(var(--sar) + 1em);bottom:calc(var(--sab) + 1em);width:22em;
  background:linear-gradient(135deg,#1b2838 0%,#101822 100%);border:.18em solid #ffd54f;border-radius:.8em;
  padding:.6em .8em;display:flex;align-items:center;gap:.8em;box-shadow:0 .6em 2em #000e;
  transform:translateY(160%);transition:transform .4s cubic-bezier(.22,1.4,.36,1);z-index:50;
}
#steam-toast.show{transform:translateY(0)}
#steam-toast canvas{width:3em;height:3em;image-rendering:pixelated;}
.st-txt{text-align:left;overflow:hidden}
.st-lbl{font:900 .75em "Arial Black",sans-serif;color:#ffd54f;letter-spacing:.06em;}
.st-nm{font-weight:900;font-size:1em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="640"></canvas>

  <div id="hud-top-btns">
    <button class="hud-ibtn" id="hud-camp" title="Voltar ao Acampamento"><span>ACAMP.</span></button>
    <button class="hud-ibtn" id="hud-restart" title="Reiniciar Run (R)"><canvas id="ic-hud-rst" width="12" height="12"></canvas><span>R</span></button>

  <div id="ach-modal" class="modal-box"><div class="modal-head"><h2>CONQUISTAS</h2><button class="btn" id="close-ach">FECHAR</button></div><div id="ach-list"></div></div>
  <div id="opt-modal" class="modal-box"><div class="modal-head"><h2><span id="opt-title">OPÇÕES</span></h2><button class="btn" id="close-opt">FECHAR</button></div><div class="opt-grid" id="opt-grid"></div></div>
  <div id="shaman-modal" class="modal-box"><div class="modal-head"><h2>CALDEIRÃO DO XAMÃ</h2><button class="btn" id="close-shaman">SAIR</button></div><div class="shaman-list" id="shaman-list"></div></div>

  <div id="steam-toast">
    <canvas id="toast-ic" width="24" height="24"></canvas>
    <div class="st-txt"><div class="st-lbl" id="toast-lbl">CONQUISTA!</div><div class="st-nm" id="toast-nm">Nome</div><div class="st-ds" id="toast-ds">Desc</div></div>
  </div>
</div>

<script>

let CFG={sfx:0.8,muted:false,shake:1,hitstop:true,touch:'auto',aspect:'fill'};
let achData={},achStats={kills:0,maxItems:0,maxDmg:2.0,larvae:0,upg:{hp:0,dm:0,sp:0,gold:0,luck:0}};
try{
  const saved=JSON.parse(localStorage.getItem('sapinhos_sapecas_v3')||localStorage.getItem('sapinhos_sapecas_v2')||'{}');
  achData=saved.ach||{};
  achStats.kills=saved.kills||0;
  achStats.maxItems=saved.maxItems||0;
  achStats.maxDmg=saved.maxDmg||2.0;
  achStats.larvae=saved.larvae||0;
  if(saved.upg)achStats.upg={...achStats.upg,...saved.upg};
  if(saved.cfg)CFG={...CFG,...saved.cfg};
}catch(e){}

function saveProgress(){
  try{
    localStorage.setItem('sapinhos_sapecas_v3',JSON.stringify({
      ach:achData,kills:achStats.kills,maxItems:achStats.maxItems,
      maxDmg:achStats.maxDmg,larvae:achStats.larvae,upg:achStats.upg,cfg:CFG
    }));
  }catch(e){}
  if($('menu-larva-cnt'))$('menu-larva-cnt').textContent=achStats.larvae;
  if(typeof updateAchUI==='function')updateAchUI();
}
function addLarvae(n){
  achStats.larvae+=n;
  saveProgress();
}
function isCharUnlocked(i){const req=CH[i].req;return !req||!!achData[req]}
function isBiomeUnlocked(bIdx){return bIdx<=0||!!achData['b'+bIdx]}

const toastQueue=[];
let toastBusy=false;
function processToastQueue(){
  if(toastBusy||!toastQueue.length)return;
  toastBusy=true;
  const a=toastQueue.shift();
  copySprTo(S.items[a.ic||0],$('toast-ic'));
  $('toast-lbl').textContent=a.lbl||'CONQUISTA DESBLOQUEADA!';
  $('toast-nm').textContent=a.nm;
  $('toast-ds').textContent=a.ds;
  $('steam-toast').classList.add('show');
  snd(523,.12,'triangle',.08,120);
  setTimeout(()=>snd(659,.12,'triangle',.08,140),90);
  setTimeout(()=>snd(784,.25,'triangle',.09,220),180);
  setTimeout(()=>{
    $('steam-toast').classList.remove('show');
    setTimeout(()=>{toastBusy=false;processToastQueue()},420);
  },3000);
}

function unlockAch(id){
  if(achData[id])return;
  const a=ACH_LIST.find(x=>x.id===id);if(!a)return;
  achData[id]=Date.now();
  achStats.larvae+=(id==='win'||id==='all_chars'?5:3);
  toastQueue.push({lbl:'CONQUISTA (+3 LARVAS)!',nm:a.nm,ds:a.ds,ic:a.ic});
  if(id!=='all_chars'&&CH.every((_,i)=>isCharUnlocked(i))){
    const allA=ACH_LIST.find(x=>x.id==='all_chars');
    if(allA&&!achData['all_chars']){
      achData['all_chars']=Date.now();
      achStats.larvae+=5;
      toastQueue.push({lbl:'CONQUISTA (+5 LARVAS)!',nm:allA.nm,ds:allA.ds,ic:allA.ic});
    }
  }
  saveProgress();
  if(typeof renderCarousel==='function')renderCarousel();
  processToastQueue();
}

function getAchProgress(a){
  if(achData[a.id])return[a.max,a.max];
  if(a.id==='k20')return[Math.min(20,achStats.kills),20];
  if(a.id==='it3')return[Math.min(3,achStats.maxItems),3];
  if(a.id==='synergy')return[Math.min(5,achStats.maxItems),5];
  if(a.id==='big_dmg')return[Math.min(4.5,Math.round(achStats.maxDmg*10)/10),4.5];
  if(a.id==='all_chars')return[CH.filter((_,i)=>isCharUnlocked(i)).length,6];
  return[0,1];
}

function updateAchUI(){
  const cnt=Object.keys(achData).length;
  if($('btn-ach'))$('btn-ach').innerHTML=`<canvas id="ic-trp-b" width="12" height="12"></canvas> CONQUISTAS (${cnt}/${ACH_LIST.length})`;
  copySprTo(S.trp,$('ic-trp-b'));
  const list=$('ach-list');if(!list)return;
  list.innerHTML=`<div style="grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-bottom:.4em">
    <span style="color:#80cbc4;font-size:.82em;font-weight:800">Cada conquista concede +3 Larvas Cristalizadas e bônus passivo!</span>
    <button class="btn" id="btn-sandbox-in" style="font-size:.75em;padding:.4em .8em;background:linear-gradient(180deg,#00acc1 0%,#006064 100%)">LIBERAR TUDO (SANDBOX)</button>
  </div>`;
  const sbBtn=$('btn-sandbox-in');
  if(sbBtn)sbBtn.onclick=()=>{
    achStats.kills=Math.max(achStats.kills,20);
    achStats.maxItems=Math.max(achStats.maxItems,5);
    achStats.maxDmg=Math.max(achStats.maxDmg,5.0);
    achStats.larvae+=25;
    ACH_LIST.forEach(a=>achData[a.id]=Date.now());
    saveProgress();if(typeof renderCarousel==='function')renderCarousel();
    snd(600,.3,'triangle',.09,400);
  };
  ACH_LIST.forEach(a=>{
    const un=!!achData[a.id];
    const [cur,mx]=getAchProgress(a);
    const pct=clamp((cur/mx)*100,0,100);
    const d=document.createElement('div');
    d.className='ach-card'+(un?' unlocked':'');
    const c=document.createElement('canvas');
    copySprTo(un?S.items[a.ic]:S.lock,c);
    d.append(c);
    d.insertAdjacentHTML('beforeend',`
      <div class="ach-info">
        <b>${a.nm}</b>
        <small>${a.ds}</small>
        <div class="ach-prog-wrap">
          <div class="ach-prog-bar"><div class="ach-prog-fill" style="width:${pct}%"></div></div>
          <span class="ach-prog-txt">${cur}/${mx}</span>
        </div>
      </div>
    `);
    list.append(d);
  });
}

function renderShamanUI(){
  const list=$('shaman-list');if(!list)return;
  list.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;padding:.3em .6em;background:#051418;border:.12em solid #00e5ff;border-radius:.5em;margin-bottom:.3em">

    <span style="color:#ffd54f;font:900 1.2em monospace">${achStats.larvae} LARVAS</span>
  </div>`;
  SHAMAN_UPG.forEach(u=>{
    const lvl=achStats.upg[u.id]||0;
    const isMax=lvl>=5;
    const cost=isMax?0:u.costs[lvl];
    const card=document.createElement('div');
    card.className='upg-card';

// REDE COOPERATIVA P2P (PEERJS + BROADCASTCHANNEL)
// =============================================================================
class NetRoom{
  constructor(code){
    this.code=code;this.handlers={};this.conns=[];this.peer=null;this.bc=null;this.ok=false;
  }
  on(t,fn){(this.handlers[t]=this.handlers[t]||[]).push(fn)}
  trigger(t,data,isMe=false){(this.handlers[t]||[]).forEach(fn=>fn({data,isMe}))}
  connected(){return this.ok}
  async connect(onStatus){
    try{
      this.bc=new BroadcastChannel('sapinhos_net_v3_'+this.code);
      this.bc.onmessage=ev=>{const m=ev.data;if(m&&m.t)this.trigger(m.t,m.d,false)};
      this.ok=true;
    }catch(e){}
    if(typeof Peer==='undefined'){if(onStatus)onStatus('Sala local ativa.');return true}
    const hostId='sapinhos-sapecas-v3-'+this.code;
    return new Promise(resolve=>{
      let settled=false;
      const done=msg=>{if(!settled){settled=true;this.ok=true;if(onStatus)onStatus(msg);resolve(true)}};
      try{
        const p=new Peer(hostId,{debug:0});
        this.peer=p;
        p.on('open',()=>done('Sala Online criada!'));
        p.on('connection',conn=>{this.setupConn(conn);unlockAch('coop')});
        p.on('error',err=>{
          if(err.type==='unavailable-id'){
            try{p.destroy()}catch(e){}
            const cp=new Peer({debug:0});
            this.peer=cp;
            cp.on('open',()=>{
              const conn=cp.connect(hostId,{reliable:false});
              this.setupConn(conn);
              conn.on('open',()=>{unlockAch('coop');done('Conectado via WebRTC!')});
              setTimeout(()=>done('Conectado!'),1600);
            });
            cp.on('error',()=>done('Modo Co-op Local ativo.'));
          }else done('Modo Co-op Local ativo.');
        });
        setTimeout(()=>done('Sala pronta!'),2000);
      }catch(e){done('Modo Co-op Local ativo.')}
    });
  }
  setupConn(conn){
    this.conns.push(conn);
    conn.on('data',m=>{if(m&&m.t){this.trigger(m.t,m.d,false);unlockAch('coop')}});
    conn.on('close',()=>{this.conns=this.conns.filter(c=>c!==conn)});
  }
  async emit(t,d){
    const pkt={t,d};
    if(this.bc)try{this.bc.postMessage(pkt)}catch(e){}
    for(const c of this.conns)if(c.open)try{c.send(pkt)}catch(e){}
  }
  async leave(){
    if(this.bc)try{this.bc.close()}catch(e){}
    for(const c of this.conns)try{c.close()}catch(e){}
    if(this.peer)try{this.peer.destroy()}catch(e){}
    this.ok=false;
  }
}

function snd(f,d,ty='square',v=.05,sl=0){
  if(CFG.muted||CFG.sfx<=0)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime;
    const vol=v*CFG.sfx;
    o.type=ty;o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(28,f+sl),t+d);
    gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(gn);gn.connect(AC.destination);o.start();o.stop(t+d);
  }catch(e){}
}

function updatePlayerZAndMove(dt){
  if(me.jumpCd>0)me.jumpCd=Math.max(0,me.jumpCd-dt);
  let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+touchState.lx;
  let my=(keys.KeyS?1:0)-(keys.KeyW?1:0)+touchState.ly;
  const l=Math.hypot(mx,my);
  if(l>1){mx/=l;my/=l}

  if(me.jumpT>0){
    me.jumpT-=dt;
    const prog=clamp(1-(me.jumpT/0.42),0,1);
    me.z=Math.sin(prog*Math.PI)*24;
    me.mvx=me.jvx*0.82+mx*me.sp*0.35;
    me.mvy=me.jvy*0.82+my*me.sp*0.35;
    if(me.jumpT<=0){
      me.jumpT=0;me.z=0;me.j=0.35;
      dust(me.x,me.y+10,'#a5d6a7',8);
      snd(190,.08,'triangle',.05,-70);
      // Impacto do Salto quebra barris/vasos adjacentes!
      if(ST==='play'&&typeof breakNearbyProps==='function')breakNearbyProps(me.x,me.y,22);
    }
  }else{
    me.z=0;
    const inW=(ST==='play'&&!me.fly&&typeof inWater==='function'&&inWater(me.x,me.y));
    const slowMult=inW?0.65:1.0;
    me.mvx=mx*me.sp*slowMult;
    me.mvy=my*me.sp*slowMult;
    if(l>0.1){
      me.wf=((TT*10)|0)%2;
      me.v+=Math.sin(TT*22)*.9;
      if(Math.random()<dt*12){
        const isApex=me.its.length>=5||Object.keys(me.syn||{}).length>0;
        dust(me.x,me.y+12,isApex?CH[me.ch].a:(slowMult<1?'#26c6da':'#66bb6a'),1);
      }
    }else me.wf=0;
  }

  me.x+=me.mvx*dt;
  me.y+=me.mvy*dt;

  let sx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0)+touchState.rx;
  let sy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0)+touchState.ry;
  const sl=Math.hypot(sx,sy);
  if(sl>0.15){
    me.ax=sx/sl;me.ay=sy/sl;
    me.ang=Math.atan2(me.ay,me.ax);
  }else if(mouse.active){
    const dy=mouse.y-(me.y-6-me.z),dx=mouse.x-me.x;
    me.ang=Math.atan2(dy,dx);
    me.ax=Math.cos(me.ang);me.ay=Math.sin(me.ang);
  }
  const wantFire=mouse.down||sl>0.15;
  me.cd-=dt;
  if(wantFire&&me.cd<=0&&me.z<=4&&typeof fire==='function')fire();
}

function rollItemByRarity(r,minR=0,maxR=3,frogIdx=ch){
  const luckBonus=(achStats.upg?.luck||0)*0.08+(achData.synergy?0.05:0);
  const roll=r()+luckBonus;
  let targetR=minR;
  if(roll>0.92)targetR=3;
  else if(roll>0.74)targetR=2;
  else if(roll>0.44)targetR=1;
  targetR=clamp(targetR,minR,maxR);

  const affList=CH[frogIdx]?.aff||[];
  const affPool=[],genPool=[];
  IT.forEach((it,idx)=>{
    if(it[2]===targetR){
      genPool.push(idx);
      if(affList.includes(idx))affPool.push(idx);
    }
  });
  if(affPool.length&&r()<0.65)return affPool[(r()*affPool.length)|0];
  return genPool.length?genPool[(r()*genPool.length)|0]:0;
}

function genFloor(bIdx,seed){
  const r=sr(seed+bIdx*7919);
  const grid=Array.from({length:5},(_,gy)=>Array.from({length:5},(_,gx)=>({
    gx,gy,active:false,type:'none',vis:false,clear:false,lay:0,
    doors:{N:false,S:false,W:false,E:false},locked:false,
    chest:null,shop:null,coopChest:null,totem:null
  })));

  const cells=[];
  const addCell=(gx,gy,type='combat')=>{
    const c=grid[gy][gx];
    if(!c.active){
      c.active=true;c.type=type;
      c.lay=((gx*7+gy*13+bIdx*5)%4);
      cells.push(c);
    }
    return c;
  };

  addCell(2,2,'start').vis=true;
  grid[2][2].clear=true;

  const dirs=[[0,-1,'N','S'],[0,1,'S','N'],[-1,0,'W','E'],[1,0,'E','W']];
  let cx=2,cy=2,targetCount=8+((r()*2)|0),tries=0;
  while(cells.length<targetCount&&tries++<200){
    const d=dirs[(r()*4)|0];
    const nx=cx+d[0],ny=cy+d[1];
    if(nx>=0&&nx<5&&ny>=0&&ny<5){
      addCell(nx,ny,'combat');
      cx=nx;cy=ny;
    }else{
      const pick=cells[(r()*cells.length)|0];
      cx=pick.gx;cy=pick.gy;
    }
  }

  for(let y=0;y<5;y++)for(let x=0;x<5;x++){
    const c=grid[y][x];if(!c.active)continue;
    for(const [dx,dy,d1,d2] of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<5&&ny>=0&&ny<5&&grid[ny][nx].active){
        c.doors[d1]=true;grid[ny][nx].doors[d2]=true;
      }
    }
  }

  const candidates=cells.filter(c=>!(c.gx===2&&c.gy===2));
  candidates.sort((a,b)=>{
    const da=Math.abs(a.gx-2)+Math.abs(a.gy-2),db=Math.abs(b.gx-2)+Math.abs(b.gy-2);
    return db-da;
  });

  const bossCell=candidates[0];
  bossCell.type='boss';bossCell.lay=0;

  const shopCell=candidates[candidates.length>2?candidates.length-1:1];
  shopCell.type='shop';shopCell.clear=true;shopCell.lay=0;
  const kShop1=rollItemByRarity(r,0,1,ch);
  let kShop2=rollItemByRarity(r,1,3,ch);
  if(kShop2===kShop1)kShop2=(kShop2+1)%IT.length;
  shopCell.shop=[
    {x:144,y:168,t:'hp',nm:'CORAÇÃO FRESCO',ds:'Restaura +1 Vida',cost:8,sold:false},
    {x:208,y:168,t:'key',nm:'CHAVE DE OSSO',ds:'Abre Sala de Mutação',cost:12,sold:false},
    {x:272,y:168,t:'ankh_or_it',k:kShop1,cost:RAR_INFO[IT[kShop1][2]].cost,sold:false},
    {x:336,y:168,t:'it',k:kShop2,cost:RAR_INFO[IT[kShop2][2]].cost,sold:false}
  ];

  const treasCell=candidates.find(c=>c!==bossCell&&c!==shopCell)||candidates[1];
  treasCell.type='treasure';treasCell.clear=true;treasCell.lay=0;treasCell.locked=true;
  treasCell.chest={x:240,y:162,open:false,k:rollItemByRarity(r,1,3,ch)};

  for(const c of cells){
    if(c.type==='combat'){
      c.coopChest={x:240,y:162,spawned:false,open:false,k:rollItemByRarity(r,1,3,ch)};
      c.totem={x:240,y:76,state:0}; // 0=Pronto, 1=Onda Elite Ativa, 2=Concluído
    }
  }
  return grid;
}

function buildRoomLayout(key,cell,bIdx){
  if(RK[key])return;
  const r=sr((cell.gx*31+cell.gy*97+bIdx*313+wd.fSeed)|0);
  const a=[],hz={water:[],spikes:[],tables:[],props:[]};
  const addBlk=(cx,cy)=>{
    if(cx>=5&&cx<=7&&(cy<=1||cy>=6))return;
    if(cy>=3&&cy<=4&&(cx<=1||cx>=11))return;
    if(cx===6&&cy===4)return;
    if(!a.some(q=>q.cx==cx&&q.cy==cy))a.push({cx,cy,x:M+cx*32,y:M+cy*32});
  };

  if(cell.type==='combat'){
    const lay=cell.lay;
    if(lay===0){
      [[2,1],[10,1],[2,6],[10,6],[3,2],[9,2],[3,5],[9,5]].forEach(([x,y])=>addBlk(x,y));
    }else if(lay===1){
      [[5,3],[7,3],[3,1],[9,1],[3,6],[9,6],[2,4],[10,4]].forEach(([x,y])=>addBlk(x,y));
    }else if(lay===2){
      hz.water.push(
        {x:M+64,y:M+54,rx:50,ry:32},
        {x:W-M-64,y:M+54,rx:50,ry:32},
        {x:240,y:168,rx:60,ry:30}
      );
      [[3,2],[9,2],[4,5],[8,5]].forEach(([x,y])=>addBlk(x,y));
    }else if(lay===3){
      [[4,2],[8,2],[4,5],[8,5],[6,2],[6,5],[3,4],[9,4]].forEach(([cx,cy])=>{
        hz.spikes.push({cx,cy,x:M+cx*32+16,y:M+cy*32+16});
      });
      [[2,1],[10,1],[2,6],[10,6]].forEach(([x,y])=>addBlk(x,y));
    }

    // Mesas Tumbáveis estilo Enter the Gungeon (2 a 3 por sala de combate)
    const tPos=[[156,128],[324,128],[156,204],[324,204]];
    tPos.forEach(([tx,ty],idx)=>{
      if(r()<0.68||idx<2){
        if(!a.some(k=>Math.hypot((k.x+16)-tx,(k.y+16)-ty)<28)){
          hz.tables.push({id:idx,x:tx,y:ty,flip:false,hp:18,mh:18,j:0,v:0,fl:0});
        }
      }
    });

    // Props Destrutíveis nas Bordas (Barris, Vasos de Barro, Caixas)
    const pSpots=[[M+22,M+24],[W-M-22,M+24],[M+22,H-M-24],[W-M-22,H-M-24],[M+54,M+20],[W-M-54,M+20],[M+54,H-M-20],[W-M-54,H-M-20]];
    pSpots.forEach(([px,py],idx)=>{
      if(r()<0.75){
        const ptys=['barrel','pot','crate'];
        hz.props.push({id:idx,x:px,y:py,t:ptys[(idx+(bIdx|0))%3],dead:false,j:0,v:0});
      }
    });
  }else if(cell.type==='boss'){
    hz.water.push({x:M+48,y:M+48,rx:34,ry:22},{x:W-M-48,y:M+48,rx:34,ry:22});
    [[M+24,M+24],[W-M-24,M+24],[M+24,H-M-24],[W-M-24,H-M-24]].forEach(([px,py],idx)=>{
      hz.props.push({id:idx,x:px,y:py,t:'pot',dead:false,j:0,v:0});
    });
  }
  RK[key]=a;HZ[key]=hz;
}

function hazards(){
  if(ST!=='play')return{water:[],spikes:[],tables:[],props:[]};
  const c=curCell();if(!c)return{water:[],spikes:[],tables:[],props:[]};
  const k=rmKey();buildRoomLayout(k,c,wd.bIdx);return HZ[k];
}
const spikesUp=()=>((TT%2.5)>1.45);
const spikesWarn=()=>((TT%2.5)>1.1&&!spikesUp());
const inRock=(x,y)=>rocks().some(k=>x>k.x+2&&x<k.x+30&&y>k.y+2&&y<k.y+30);

function inWater(x,y){
  if(ST!=='play')return false;
  for(const w of hazards().water){
    if(((x-w.x)/w.rx)**2+((y-w.y)/w.ry)**2<=1)return true;
  }
  return false;
}

function pushOut(o,r){
  if(o.fly||o.z>8)return;
  for(const k of rocks()){
    const cx=clamp(o.x,k.x+2,k.x+30),cy=clamp(o.y,k.y+2,k.y+30),dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
    if(d<r){if(d>.01){o.x+=dx/d*(r-d);o.y+=dy/d*(r-d)}else o.y-=r}
  }
  // Colisão suave com Mesas Viradas
  for(const tb of TABLES){
    if(tb.hp>0&&tb.flip){
      const dx=o.x-tb.x,dy=o.y-tb.y,d=Math.hypot(dx,dy);
      if(d<r+11&&d>.01){o.x+=dx/d*(r+11-d);o.y+=dy/d*(r+11-d)}
    }
  }
}

function breakProp(pr){
  if(!pr||pr.dead)return;
  pr.dead=true;
  const col=pr.t==='pot'?'#ffab91':'#8d6e63';
  pt(pr.x,pr.y,col,14,90,.45,2.8,180);
  snd(180+Math.random()*70,.08,'square',.04,-60);
  if(Math.random()<0.20)spawnGoldFlies(pr.x,pr.y,1);
  else if(Math.random()<0.05)DROPS.push({id:rnd(),x:pr.x,y:pr.y,t:'hp',j:0,v:8});
}
function breakNearbyProps(x,y,rad){
  for(const pr of PROPS){
    if(!pr.dead&&Math.hypot(pr.x-x,pr.y-y)<rad)breakProp(pr);
  }
}

// Cenário do Acampamento com Lagoa, Tapete do Xamã e Clareira
function bgCamp(){
  if(CAMP_BG)return CAMP_BG;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),r=sr(777);
  x.fillStyle='#0d1f14';x.fillRect(0,0,W,H);
  for(let i=0;i<15;i++)for(let j=0;j<10;j++){
    x.fillStyle=(i+j)%2?'#172e1c':'#1b3621';
    x.fillRect(i*32,j*32,32,32);
  }
  // Tapete Místico do Sapo Xamã (Canto Inferior Esquerdo)
  x.fillStyle='#102830';x.beginPath();x.ellipse(92,238,42,26,0,0,7);x.fill();
  x.strokeStyle='#00e5ff';x.lineWidth=1.5;x.beginPath();x.ellipse(92,238,38,22,0,0,7);x.stroke();
  // Clareira Central da Fogueira
  x.fillStyle='#2b2319';x.beginPath();x.ellipse(240,174,105,64,0,0,7);x.fill();
  x.fillStyle='#382e21';x.beginPath();x.ellipse(240,174,84,50,0,0,7);x.fill();
  // Lagoa Noturna na Direita
  x.fillStyle='#0d3349';x.beginPath();x.ellipse(442,265,58,42,0,0,7);x.fill();
  for(let i=0;i<150;i++){
    const px=(r()*W)|0,py=(r()*H)|0;
    x.fillStyle=r()<.25?'#ffd54f':(r()<.5?'#69f0ae':'#2e573c');
    x.fillRect(px,py,2,2);
  }
  return CAMP_BG=c;
}

// Cenário 2.5D das Salas da Masmorra (Com Paredes em Relevo e Ladrilhos Detalhados)
function bg(){
  const cell=curCell();if(!cell)return bgCamp();
  const key=rmKey();if(BG[key])return BG[key];
  const t=TH[wd.bIdx],c=document.createElement('canvas');
  c.width=W;c.height=H;const x=c.getContext('2d'),r=sr((cell.gx*41+cell.gy*97+wd.bIdx*13)|0);
  x.fillStyle=t.w;x.fillRect(0,0,W,H);

  // Paredes 2.5D com Tijolos e Face Frontal
  x.fillStyle=t.wl;
  for(let y=0;y<H;y+=16)for(let i=(y/16)%2*16-16;i<W;i+=32)x.fillRect(i+1,y+1,30,14);
  // Face frontal 2.5D da parede norte (estilo Enter the Gungeon)
  x.fillStyle='#09120c';x.fillRect(M,M-10,W-M*2,10);
  x.fillStyle=t.wl;
  for(let i=M;i<W-M;i+=16){
    x.fillRect(i+1,M-9,14,4);
    x.fillRect(i+5,M-4,10,3);
  }

  // Piso de Ladrilhos com Junta Escura e Rachaduras
  for(let i=0;i<13;i++)for(let j=0;j<8;j++){
    const tx=M+i*32,ty=M+j*32;
    x.fillStyle=(i+j)%2?t.f1:t.f2;x.fillRect(tx,ty,32,32);
    x.strokeStyle='#00000033';x.lineWidth=1;x.strokeRect(tx+.5,ty+.5,31,31);
    if(r()<0.28){
      x.fillStyle='#00000044';
      x.fillRect(tx+6,ty+8,8,2);x.fillRect(tx+12,ty+10,2,6);
    }
  }

  // Bordas de Pedra 2.5D ao redor dos Fossos/Poças de Lodo
  const hz=hazards();
  for(const w of hz.water){
    x.fillStyle='#09120e';x.beginPath();x.ellipse(w.x,w.y-2,w.rx+6,w.ry+6,0,0,7);x.fill();
    x.fillStyle=t.hz;x.beginPath();x.ellipse(w.x,w.y,w.rx+3,w.ry+3,0,0,7);x.fill();
    x.fillStyle=t.a;x.globalAlpha=.24;x.beginPath();x.ellipse(w.x,w.y+1,w.rx-3,w.ry-3,0,0,7);x.fill();
    x.globalAlpha=1;
  }

  if(cell.type==='shop'){
    x.fillStyle='#3b0f70';x.fillRect(118,116,244,72);
    x.strokeStyle='#ffd54f';x.lineWidth=2;x.strokeRect(120,118,240,68);
  }

  // Sombra Projetada das Paredes na Arena
  for(let k=0;k<12;k++){
    x.fillStyle='rgba(0,0,0,'+(.48-k*.038)+')';
    x.fillRect(M,M+k,416,1);x.fillRect(M,H-M-1-k,416,1);
    x.fillRect(M+k,M,1,256);x.fillRect(W-M-1-k,M,1,256);
  }
  return BG[key]=c;
}

const VIG=(()=>{
  const k=document.createElement('canvas');k.width=W;k.height=H;
  const x=k.getContext('2d'),r=x.createRadialGradient(240,160,95,240,160,290);
  r.addColorStop(0,'#0000');r.addColorStop(1,'#000b');x.fillStyle=r;x.fillRect(0,0,W,H);return k;
})();

function applyCharToMe(cIdx){
  ch=cIdx;
  const c=CH[ch];
  const u=achStats.upg||{hp:0,dm:0,sp:0,gold:0,luck:0};
  const achHp=achData.all_chars?1:0;
  const achDm=(achData.first_blood?0.05:0)+(achData.big_dmg?0.2:0);
  const achSp=(achData.b3?4:0)+(achData.untouch?3:0);
  const achRt=achData.b4?0.95:1.0;

  const totalHp=c.hp+u.hp+achHp;
  const totalDm=+(c.dm*(1+u.dm*0.12)+achDm).toFixed(2);
  const totalSp=Math.round(c.sp*(1+u.sp*0.06)+achSp);

  me={
    id:me?me.id:Math.random().toString(36).slice(2,8),
    x:me?me.x:240,y:me?me.y:225,z:0,jumpT:0,jumpCd:0,jvx:0,jvy:0,ang:1.57,
    hp:totalHp,mh:totalHp,sp:totalSp,dm:totalDm,rt:+(c.rt*achRt).toFixed(3),
    cd:0,dead:false,inv:0,ax:0,ay:1,w:c.wp,
    pr:0,hm:c.hm,big:1,sh:c.sh,shi:c.sh,fly:c.fly,
    tri:0,tox:0,bnc:0,fam:0,vmp:0,exp:0,rear:0,
    hyper:0,elec:0,clone:0,ankh:0,kills:0,
    gold:me?me.gold:(u.gold*8),keys:me?me.keys:(1+(achData.synergy?1:0)),revP:0,
    its:[],syn:{},j:0,v:0,mvx:0,mvy:0,pk:0,puff:0,wf:0,ch
  };
}

function initFloor(bIdx,seed){
  wd.bIdx=bIdx;
  wd.fSeed=seed||((Math.random()*99999)|0)+1;
  wd.gx=2;wd.gy=2;
  wd.grid=genFloor(wd.bIdx,wd.fSeed);
  wd.en=[];wd.eb=[];wd.clear=true;wd.over='';wd.trapdoor=false;
  lastKey='';
}

function reset(toCamp=false){
  const oldId=me?me.id:null;
  const u=achStats.upg||{hp:0,dm:0,sp:0,gold:0,luck:0};
  me=null;applyCharToMe(ch);if(oldId)me.id=oldId;
  me.gold=u.gold*8;
  me.keys=1+(achData.synergy?1:0);
  wd={bIdx:camp.sign.bIdx||0,fSeed:((Math.random()*99999)|0)+1,gx:2,gy:2,grid:null,en:[],eb:[],clear:true,over:'',trapdoor:false};
  initFloor(wd.bIdx,wd.fSeed);
  myB=[];rB=[];BEAMS=[];POOLS=[];DROPS=[];FLIES=[];LARVAE=[];ARCS=[];TABLES=[];PROPS=[];
  lastKey='';DC.length=0;prevOver='';hint=8;roomDamaged=false;
  if(toCamp){
    ST='camp';me.x=240;me.y=235;
  }
}
reset(false);

function E(t,x,y,chmp=0){
  const bo=t.startsWith('B');
  const coopMult=act().length>0?(bo?1.65:1.45):1.0;
  const scaleHp=1+(wd.bIdx*0.22);
  const baseHp=Math.round((HP[t]||12)*(bo?1:scaleHp)*(chmp?1.5:1)*coopMult);
  return{
    id:rnd(),t,x,y,rx:x,hp:baseHp,mh:baseHp,
    c:.7+Math.random()*1.0,j:0,v:0,fl:0,chmp:chmp?1:0,
    chemT:0,chemBy:'',
    seg:t=='B2'?Array.from({length:6},()=>({x,y})):null
  };
}

const BIOME_POOLS=[
  ['f','g','s','spd'],
  ['g','s','c','m','bmb'],
  ['s','c','m','plt','snk'],
  ['c','m','bmb','plt','gho','snk'],
  ['bmb','plt','snk','gho','spd','c']
];

function enterCell(gx,gy,fromDir){
  wd.gx=gx;wd.gy=gy;
  const cell=curCell();if(!cell)return;
  cell.vis=true;
  myB=[];rB=[];BEAMS=[];POOLS=[];DROPS=[];FLIES=[];LARVAE=[];ARCS=[];DC.length=0;
  tr=0.85;me.j=-.35;me.z=0;me.jumpT=0;roomDamaged=false;
  if(fromDir==='N'){me.x=240;me.y=H-M-20}
  else if(fromDir==='S'){me.x=240;me.y=M+20}
  else if(fromDir==='W'){me.x=W-M-20;me.y=160}
  else if(fromDir==='E'){me.x=M+20;me.y=160}
  else{me.x=240;me.y=220}

  const hz=hazards();
  TABLES=hz.tables.map(t=>({...t}));
  PROPS=hz.props.map(p=>({...p}));

  if(me.shi)me.sh=1;
  me.inv=1.2;nextT=now()+650;
  dust(me.x,me.y+10,'#81c784',8);

  if(isHost()){
    wd.eb=[];wd.en=[];wd.trapdoor=false;
    if(!cell.clear){
      if(cell.type==='boss'){
        wd.clear=false;
        wd.en.push(E('B'+wd.bIdx,240,104,0));
      }else if(cell.type==='combat'){
        wd.clear=false;
        const n=3+wd.bIdx+(act().length?2:0),pl=BIOME_POOLS[wd.bIdx];
        const chmpChance=Math.min(0.42,0.1+wd.bIdx*0.07);
        for(let i=0;i<n;i++){
          let x,y,k=0;
          do{x=64+Math.random()*352;y=54+Math.random()*130}while(inRock(x,y)&&k++<15);
          const isChmp=Math.random()<chmpChance?1:0;
          wd.en.push(E(pl[(Math.random()*pl.length)|0],x,y,isChmp));
        }
      }
    }else{
      wd.clear=true;
      if(cell.type==='boss')wd.trapdoor=true;
    }
  }
}

function shoot(e,dx,dy,v){
  const spd=v*1.15;
  wd.eb.push({id:rnd(),x:e.x,y:e.y,vx:dx*spd,vy:dy*spd});
}

function hostUpd(dt){
  if(ST!=='play'||wd.over)return;
  const cell=curCell();if(!cell)return;
  const T=[];if(!me.dead)T.push(me);for(const o of act())if(!o.d)T.push({x:o.x,y:o.y});
  const aggr=1+wd.bIdx*0.08;

  if(T.length)for(const e of wd.en){
    if(e.chemT>0)e.chemT=Math.max(0,e.chemT-dt);
    e.c=(e.c??1)-dt*aggr;
    let tg=T[0],bd=1e12;
    if(e.t.startsWith('B')&&T.length>1){
      tg=T[((TT*0.8)|0)%T.length];
    }else{
      for(const p of T){const d=(p.x-e.x)**2+(p.y-e.y)**2;if(d<bd){bd=d;tg=p}}
    }
    const dx=tg.x-e.x,dy=tg.y-e.y,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;
    let sp=({f:58,g:36,s:18,c:30,bmb:46,plt:0,snk:70,gho:32,spd:24,B0:30,B1:42,B2:82,B3:24,B4:38}[e.t]||0)*aggr*(e.chmp?1.15:1);

    if(e.t=='m'||e.t=='n')sp=(e.t=='m'?85:115)*Math.max(0,Math.sin(Date.now()/(e.t=='m'?330:240)+e.id))*aggr;
    if(e.t=='c'){
      if(e.dash>0){e.dash-=dt;e.x+=e.dx*260*dt;e.y+=e.dy*260*dt;sp=0;if(e.dash<=0)e.c=1.2+Math.random()*.7}
      else if(e.tel>0){sp=0;e.tel-=dt;if(e.tel<=0)e.dash=.48}
      else if(e.c<=0){e.tel=.48;e.dx=ux;e.dy=uy}
    }
    if(e.t=='snk'){
      const px=-uy,py=ux,wob=Math.sin(TT*9+e.id)*55;
      e.x+=(ux*sp+px*wob)*dt;e.y+=(uy*sp+py*wob)*dt;sp=0;
    }
    if(e.t=='spd'&&e.c<=0){
      e.c=.78+Math.random()*.4;e.x+=ux*44;e.y+=uy*44;e.j=-.35;
    }
    if(e.t=='gho'&&e.c<=0){
      e.c=1.9;e.x=clamp(tg.x+(Math.random()-.5)*110,M+20,W-M-20);e.y=clamp(tg.y+(Math.random()-.5)*90,M+20,H-M-20);
      shoot(e,ux,uy,112);if(e.chmp)shoot(e,-ux,-uy,112);
    }
    if(e.t=='plt'&&e.c<=0){
      e.c=1.55;const cnt=e.chmp?6:4;
      for(let k=0;k<cnt;k++){const a=.785+k*(6.283/cnt);shoot(e,Math.cos(a),Math.sin(a),98)}
    }
    if(e.t=='bmb'&&l<48)e.tel=1;else if(e.t=='bmb')e.tel=0;

    e.x+=ux*sp*dt;e.y+=uy*sp*dt;
    if(e.t=='f'||e.t=='B1')e.x+=Math.sin(Date.now()/160+e.id)*38*dt;
    if(e.t=='s'&&e.c<=0){
      e.c=1.45;shoot(e,ux,uy,115);
      if(e.chmp){
        const ba=Math.atan2(uy,ux);
        shoot(e,Math.cos(ba+.25),Math.sin(ba+.25),110);
        shoot(e,Math.cos(ba-.25),Math.sin(ba-.25),110);
      }
    }

    if(e.t.startsWith('B')){
      const p2=e.hp<e.mh*.5;
      if(e.t=='B0'){
        if(e.c<=0){
          e.c=p2?1.1:1.6;e.j=-.45;e.st=(e.st||0)+1;
          const n=p2?14:10,a0=e.st*.4;
          for(let i=0;i<n;i++){const a=a0+i*6.283/n;shoot(e,Math.cos(a),Math.sin(a),98)}
          if(e.st%2===0){
            const ba=Math.atan2(uy,ux);
            for(let k=-1;k<=1;k++)shoot(e,Math.cos(ba+k*.2),Math.sin(ba+k*.2),130);
          }
          if(p2&&wd.en.length<4)wd.en.push(E('n',e.x+20,e.y+20));
        }
      }else if(e.t=='B1'){
        if(e.c<=0){
          e.c=p2?.32:.48;e.ang=(e.ang||0)+.52;
          const arms=p2?5:3;
          for(let i=0;i<arms;i++){const a=e.ang+i*6.283/arms;shoot(e,Math.cos(a),Math.sin(a),120)}
          if(Math.random()<.16&&wd.en.length<5)wd.en.push(E('f',e.x,e.y+24));
        }
      }else if(e.t=='B2'){
        e.ang=(e.ang||0)+dt*(p2?2.7:1.9);
        e.x+=Math.cos(e.ang)*98*dt;e.y+=Math.sin(e.ang*1.3)*78*dt;
        if(e.seg){
          let px=e.x,py=e.y;
          for(const sg of e.seg){
            const sdx=px-sg.x,sdy=py-sg.y,sd=Math.hypot(sdx,sdy)||1;
            if(sd>14){sg.x+=sdx/sd*(sd-14);sg.y+=sdy/sd*(sd-14)}
            px=sg.x;py=sg.y;
          }
        }
        if(e.c<=0){
          e.c=p2?.88:1.3;const fan=p2?2:1;
          for(let i=-fan;i<=fan;i++){const a=Math.atan2(uy,ux)+i*.22;shoot(e,Math.cos(a),Math.sin(a),130)}
        }
      }else if(e.t=='B3'){
        if(e.c<=0){
          e.c=p2?.98:1.45;e.ang=(e.ang||0)+.42;
          const n=p2?16:12;
          for(let i=0;i<n;i++){const a=e.ang+i*6.283/n;shoot(e,Math.cos(a),Math.sin(a),105)}
          const ba=Math.atan2(uy,ux);shoot(e,Math.cos(ba),Math.sin(ba),145);
        }
      }else if(e.t=='B4'){
        if(e.c<=0){
          e.c=p2?.82:1.25;const n=p2?18:12,a0=TT*2.2;
          for(let i=0;i<n;i++){const a=a0+i*6.283/n;shoot(e,Math.cos(a),Math.sin(a),p2?120:98)}
          for(let i=-1;i<=1;i++){const a=Math.atan2(uy,ux)+i*.18;shoot(e,Math.cos(a),Math.sin(a),150)}
          if(p2&&wd.en.length<5&&Math.random()<.35)wd.en.push(E('bmb',e.x,e.y+28));
        }
      }
    }
    e.x=clamp(e.x,M+14,W-M-14);e.y=clamp(e.y,M+14,H-M-14);
  }

  // Projéteis Inimigos + Bloqueio por Mesas Tumbadas!
  for(let i=wd.eb.length-1;i>=0;i--){
    const b=wd.eb[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    let blocked=false;
    for(const tb of TABLES){
      if(tb.hp>0&&tb.flip&&Math.hypot(b.x-tb.x,b.y-tb.y)<15){
        tb.hp-=3;tb.fl=0.1;tb.v+=6;blocked=true;
        pt(b.x,b.y,'#8d6e63',5,70,.3,2);
        if(tb.hp<=0){pt(tb.x,tb.y,'#5d4037',18,110,.5,3);snd(140,.14,'sawtooth',.06,-60)}
        break;
      }
    }
    if(blocked||b.x<=M-4||b.x>=W-M+4||b.y<=M-4||b.y>=H-M+4||inRock(b.x,b.y)){
      wd.eb.splice(i,1);
    }
  }

  if(!wd.clear&&!wd.en.length){
    wd.clear=true;cell.clear=true;
    if(!roomDamaged){
      unlockAch('untouch');
      if(Math.random()<0.30)spawnLarvaDrop(240,160,1);
    }
    // Conclusão da Onda de Elite do Totem de Desafio!
    if(cell.totem&&cell.totem.state===1){
      cell.totem.state=2;
      if(cell.coopChest)cell.coopChest.spawned=true;
      spawnLarvaDrop(240,126,1);
      spawnGoldFlies(240,126,6);
      FT.push({x:240,y:96,s:'DESAFIO DO TOTEM VENCIDO! (+1 LARVA & BAÚ)',c:'#00e5ff',l:2.2,b:1});
      snd(580,.4,'triangle',.1,420);
    }else{
      snd(440,.25,'triangle',.07,220);
    }
    if(cell.type==='boss'){
      spawnLarvaDrop(240,150,3+((Math.random()*2)|0));
      if(wd.bIdx>=4){wd.over='win';unlockAch('win')}
      else wd.trapdoor=true;
    }
  }
}

function spawnGoldFlies(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=35+Math.random()*65;
    FLIES.push({
      id:rnd(),x,y,z:4+Math.random()*8,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:75+Math.random()*55
    });
  }
}

function spawnLarvaDrop(x,y,n=1){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,sp=28+Math.random()*45;
    LARVAE.push({
      id:rnd(),x,y,z:6+Math.random()*8,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,vz:85+Math.random()*45
    });
  }
}

function deathFx(e){

  snd(bo?85:210,bo?.6:.2,'sawtooth',.07,-60);
  DC.push({x:e.x,y:e.y+8,c:CL[e.t]||'#4caf50',r:bo?18:(e.chmp?11:6+Math.random()*7)});
  if(DC.length>45)DC.shift();

  const flyCnt=bo?(14+((Math.random()*6)|0)):(e.chmp?(4+((Math.random()*3)|0)):(1+((Math.random()*3)|0)));
  spawnGoldFlies(e.x,e.y,flyCnt);

  if(e.chmp&&Math.random()<0.38)spawnLarvaDrop(e.x,e.y,1);

    if(Math.random()<0.30||bo)DROPS.push({id:rnd(),x:e.x+8,y:e.y,t:'key',j:0,v:8});
  }

  achStats.kills++;unlockAch('first_blood');
  if(achStats.kills>=20)unlockAch('k20');else saveProgress();
  if(e.t=='B0')unlockAch('b1');
  if(e.t=='B1')unlockAch('b2');
  if(e.t=='B2')unlockAch('b3');
  if(e.t=='B3')unlockAch('b4');

  if(me.vmp){

      me.hp++;FT.push({x:me.x,y:me.y-24,s:'+1 VIDA (VAMPIRO)!',c:'#ff5252',l:.9});
    }
  }
}

function spawnBullet(x,y,a,w,dmgMult=1,extra={}){
  const spMult=me.hyper?1.3:1.0;
  const vx=Math.cos(a)*w.sp*spMult+(me.mvx||0)*.22,vy=Math.sin(a)*w.sp*spMult+(me.mvy||0)*.22;
  const r=(extra.r||w.r)*me.big*(me.hyper?1.2:1);
  const isShoal=hasSyn(me,'shoal')&&me.w===1;
  const isMortar=hasSyn(me,'mortar')&&me.w===4;
  const isFoam=hasSyn(me,'foam')&&me.w===2;
  const isRoyal=hasSyn(me,'royal')&&me.w===0;

  const bObj={
    x,y,ox:x,oy:y,vx,vy,l:extra.l||w.l||1.15,r,
    d:w.dm*me.dm*(me.big>1?1.25:1)*(me.elec?1.4:1)*dmgMult,
    p:w.pi||me.pr||w.tng||isRoyal,
    bnc:extra.bnc!==undefined?extra.bnc:((w.bnc||0)+me.bnc+(isMortar?2:0)),
    aoe:(w.aoe||0)+(me.exp?24:0),
    pool:w.pool||me.tox||isMortar,
    tng:w.tng,oid:me.id,w:me.w,
    col:isRoyal?'#00ffaa':(extra.col||w.col),
    shoal:isShoal?1:0,foam:isFoam&&!extra.noSplit?1:0,royal:isRoyal?1:0,
    chem:0,trailT:0,hit:[],ka:a
  };
  myB.push(bObj);
  if(R&&R.connected()&&!extra.noNet){
    R.emit('sh',{
      x:x|0,y:y|0,vx:vx|0,vy:vy|0,r:Math.round(r*10)/10,w:me.w,l:bObj.l,
      tng:w.tng?1:0,oid:me.id,aoe:bObj.aoe,pool:bObj.pool?1:0,bnc:bObj.bnc,col:bObj.col
    }).catch(()=>{});
  }
}

function fireBeam(x,y,a,w,isBounce=false){
  const bw=6*me.big;
  BEAMS.push({x,y,a,col:w.col,l:.22,m:.22,w:bw});
  if(R&&R.connected()&&!isBounce){
    R.emit('sh',{beam:1,x:x|0,y:y|0,a:Math.round(a*100)/100,col:w.col,bw}).catch(()=>{});
  }
  const dx=Math.cos(a),dy=Math.sin(a),dmg=w.dm*me.dm*(me.big>1?1.25:1)*(me.elec?1.4:1)*(isBounce?0.65:1);
  if(ST==='camp'){
    const dm=camp.dummy;
    const vx=dm.x-x,vy=dm.y-y,proj=vx*dx+vy*dy;
    if(proj>0&&proj<420&&Math.abs(vx*dy-vy*dx)<18)hitDummy(dmg);
  }else{
    for(const pr of PROPS){
      if(!pr.dead){
        const vx=pr.x-x,vy=pr.y-y,proj=vx*dx+vy*dy;
        if(proj>0&&proj<460&&Math.abs(vx*dy-vy*dx)<14)breakProp(pr);
      }
    }
    for(const e of wd.en){
      const vx=e.x-x,vy=e.y-y,proj=vx*dx+vy*dy;
      if(proj>0&&proj<460&&Math.abs(vx*dy-vy*dx)<RAD[e.t]+8*me.big){
        sendE('hit',{i:e.id,d:dmg,kx:dx*9,ky:dy*9,by:me.id});
        hitFx(e,{x:e.x,y:e.y,d:dmg,w:5});
      }
    }
  }
  if(!isBounce&&hasSyn(me,'prism')){
    const hitX=clamp(x+dx*240,M+8,W-M-8),hitY=clamp(y+dy*240,M+8,H-M-8);
    const refA=Math.atan2(-dy,dx)+0.35;
    fireBeam(hitX,hitY,refA,w,true);
  }
}

function fire(){
  const w=WP[me.w],q=Math.hypot(me.ax,me.ay)||1,dx=me.ax/q,dy=me.ay/q;
  const baseA=Math.atan2(dy,dx);
  let n=(w.n||1)+(me.tri?2:0);
  if(hasSyn(me,'shoal')&&me.w===1)n+=2;
  if(hasSyn(me,'hydra')&&me.w===3)n=Math.max(n,3);
  me.puff=.18;

  const dirs=[baseA];
  if(me.rear)dirs.push(baseA+Math.PI);

  const shootFrom=(ox,oy,mult)=>{
    for(const dA of dirs){
      for(let i=0;i<n;i++){
        const a=dA+(n>1?(i-(n-1)/2)*.22:0)+(w.jit?(Math.random()-.5)*w.jit:0);
        if(w.beam)fireBeam(ox+Math.cos(a)*10,oy+Math.sin(a)*10,a,w);
        else spawnBullet(ox+Math.cos(a)*8,oy+Math.sin(a)*8,a,w,mult);
      }
    }
  };

  shootFrom(me.x,me.y-6-me.z,1.0);
  if(me.clone){
    const cx=me.x-dx*20+dy*14,cy=me.y-6-dy*20-dx*14;
    shootFrom(cx,cy,0.55);
  }
  if(me.fam){
    for(let f=0;f<me.fam;f++){
      const fa=TT*3.5+f*3.14,fx=me.x+Math.cos(fa)*24,fy=me.y+Math.sin(fa)*18;
      spawnBullet(fx,fy,baseA,WP[0],.55);
    }
  }

  me.cd=me.rt*w.rt;
  me.v+=me.w>=4?-9:-4.5;
  snd(me.w==5?140:me.w==4?115:me.w==3?620:390,.09,me.w>=4?'sawtooth':'square',.04,-130);
  pt(me.x+dx*10,me.y-6-me.z+dy*10,w.col,4,55,.22,2);
  pt(me.x+dx*8,me.y-4,w.col,2,45,.55,2.2,220,1);
  if(me.w>=4&&me.z<=2){me.x-=dx*3;me.y-=dy*3;addShake(3.2)}
}

function got(k){
  me.its.push(k);
  const rar=RAR_INFO[IT[k][2]];
  const isAff=isItemAffinity(k,me.ch);
  // Se a mutação tiver Afinidade Genética com o Sapo atual, dá +20% de eficácia extra!
  const affMult=isAff?1.2:1.0;
  let s=`${IT[k][0]}${isAff?' [AFINIDADE!]':' ('+rar.nm+')'}`;

  if(k==0)me.dm+=+(0.9*affMult).toFixed(2);
  else if(k==1)me.rt=Math.max(.09,me.rt*(isAff?.76:.8));
  else if(k==2){const add=isAff?3:2;me.mh+=add;me.hp=Math.min(me.mh,me.hp+add)}
  else if(k==3)me.sp+=Math.round(15*affMult);
  else if(k==4){me.pr=1;if(isAff)me.dm+=.3}
  else if(k==5){me.hm=1;if(isAff)me.dm+=.35}
  else if(k==6){me.shi=1;me.sh=1}
  else if(k==7)me.big=isAff?1.8:1.65;
  else if(k==8)me.tri=1;
  else if(k==9)me.tox=1;
  else if(k==10)me.bnc+=isAff?3:2;
  else if(k==11){me.fam++;unlockAch('fam')}
  else if(k==12)me.vmp=1;
  else if(k==13){me.fly=1;unlockAch('fly_high')}
  else if(k==14){me.hyper=1;me.dm+=.45}
  else if(k==15)me.exp=1;
  else if(k==16)me.rear=1;
  else if(k==17){me.dm+=.65;me.rt=Math.max(.1,me.rt*.88);me.mh+=2;me.hp=Math.min(me.mh,me.hp+2);me.sp+=10}
  else if(k==18){me.elec=1;me.dm+=.5}
  else if(k==19){me.clone=1}

  checkSynergies();
  achStats.maxItems=Math.max(achStats.maxItems,me.its.length);
  achStats.maxDmg=Math.max(achStats.maxDmg,me.dm);
  saveProgress();

  if(me.its.length>=3)unlockAch('it3');
  if(me.its.length>=5)unlockAch('synergy');
  if(me.dm>=4.5)unlockAch('big_dmg');

  FT.push({x:me.x,y:me.y-30,s,c:isAff?'#00e5ff':rar.col,l:1.7,b:1});
  snd(520,.35,'triangle',.08,700);pt(me.x,me.y,rar.col,26,120,.6,3);me.v+=9;addShake(3);
}

function hitFx(e,b){
  e.fl=.12;e.v+=7.5;pt(b.x,b.y,CL[e.t]||'#66bb6a',5,80,.35,2.5,150);
  FT.push({x:e.x,y:e.y-14,s:String(Math.round(b.d*10)/10),c:b.chem?'#00e5ff':'#fff',l:.6});
  snd(190+Math.random()*60,.07,'square',.04,-80);
  addShake(b.w>=4?6.5:1.5);if(b.w>=4)addHs(.04);

  if(me.elec&&wd.en.length>1){
    for(const o of wd.en){
      if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<88){
        ARCS.push({x1:e.x,y1:e.y,x2:o.x,y2:o.y,l:.18});
        sendE('hit',{i:o.id,d:b.d*0.45,kx:0,ky:0,by:me.id});

      }
    }

}

function triggerAoE(b,isRemote=false){

function hitDummy(dmg){
  const dm=camp.dummy;
  dm.fl=.12;dm.v+=9;dm.j=-.28;
  dm.hits.push({t:now(),d:dmg});
  pt(dm.x,dm.y,'#ffe082',6,75,.35,2.2,140);
  FT.push({x:dm.x+(Math.random()-.5)*16,y:dm.y-18,s:dmg.toFixed(1),c:'#ffd54f',l:.65});

}

function interactE(){
  if(paused||me.dead)return;
  if(ST==='camp'){
    // 1. Abrir Caldeirão do Velho Sapo Xamã
    if(Math.hypot(me.x-camp.shaman.x,me.y-camp.shaman.y)<32){
      openShamanModal();
      return;
    }
    // 2. Trocar Sapo nos Troncos
    const taken=new Set([me.ch,...act().map(o=>o.c)]);
    for(const lg of camp.logs){
      if(!taken.has(lg.c)&&Math.hypot(me.x-lg.x,me.y-lg.y)<26){
        if(!isCharUnlocked(lg.c)){
          FT.push({x:lg.x,y:lg.y-24,s:'BLOQUEADO!',c:'#ff5252',l:1.1,b:1});
          snd(140,.15,'sawtooth',.06,-40);return;
        }
        const ox=me.x,oy=me.y;
        applyCharToMe(lg.c);
        me.x=ox;me.y=oy;
        pt(me.x,me.y,CH[me.ch].c,28,120,.6,3);
        FT.push({x:me.x,y:me.y-28,s:'TROCOU PARA '+CH[me.ch].n.toUpperCase()+'!',c:'#ffd54f',l:1.4,b:1});
        snd(480,.22,'triangle',.08,320);
        if(typeof renderCarousel==='function')renderCarousel();
        return;
      }
    }
    // 3. Placa Seletora de Bioma
    if(Math.hypot(me.x-camp.sign.x,me.y-camp.sign.y)<30){
      let nextB=(camp.sign.bIdx+1)%TH.length;
      while(!isBiomeUnlocked(nextB)&&nextB!==0)nextB=(nextB+1)%TH.length;
      camp.sign.bIdx=nextB;wd.bIdx=nextB;
      pt(camp.sign.x,camp.sign.y,'#ffd54f',18,90,.45,2.5);
      FT.push({x:camp.sign.x,y:camp.sign.y-24,s:'DESTINO: '+TH[nextB].nm.toUpperCase(),c:'#69f0ae',l:1.4,b:1});
      snd(420,.15,'triangle',.07,180);
      return;
    }
    return;
  }

  if(ST!=='play')return;
  const cell=curCell();if(!cell)return;

  // 4. Chutar e Virar Mesa de Madeira (Flip Table Cover!)
  for(const tb of TABLES){
    if(tb.hp>0&&!tb.flip&&Math.hypot(me.x-tb.x,me.y-tb.y)<28){
      tb.flip=true;tb.j=-0.48;tb.v=9;
      sendE('flipTb',{id:tb.id});
      pt(tb.x,tb.y,'#a1887f',14,85,.4,2.5);
      FT.push({x:tb.x,y:tb.y-18,s:'MESA VIRADA (COBERTURA)!',c:'#ffe082',l:.95,b:1});
      snd(220,.12,'triangle',.07,-90);
      // Empurra inimigos próximos ao chutar a mesa
      for(const e of wd.en){
        const d=Math.hypot(e.x-tb.x,e.y-tb.y);
        if(d<38){sendE('hit',{i:e.id,d:1.5,kx:(e.x-tb.x)*1.2,ky:(e.y-tb.y)*1.2,by:me.id})}
      }
      return;
    }
  }

  // 5. Ativar Totem de Desafio Co-op / Elite Wave
  if(cell.totem&&cell.totem.state===0&&wd.clear&&Math.hypot(me.x-cell.totem.x,me.y-cell.totem.y)<28){
    sendE('totem',{gx:wd.gx,gy:wd.gy});
    return;
  }

  // 6. Doar 1 Coração ao Parceiro em Co-op
  for(const o of act()){
    if(!o.d&&o.hp===1&&me.hp>=4&&Math.hypot(me.x-o.rx,me.y-o.ry)<28){
      me.hp--;
      sendE('donate',{to:o.id});
      FT.push({x:me.x,y:me.y-26,s:'DOOU +1 CORAÇÃO!',c:'#ff80ab',l:1.4,b:1});
      pt(me.x,me.y,'#ff4081',20,100,.5,2.8);snd(560,.25,'triangle',.08,300);
      return;
    }
  }

  // 7. Abrir Baús
  for(const chObj of [cell.chest,cell.coopChest]){
    if(chObj&&(chObj===cell.chest||chObj.spawned)&&!chObj.open&&Math.hypot(me.x-chObj.x,me.y-chObj.y)<26){
      chObj.open=true;
      sendE('chest',{gx:wd.gx,gy:wd.gy,coop:chObj===cell.coopChest?1:0});
      got(chObj.k);
      return;
    }
  }

  // 8. Comprar na Loja do Sapo Mercador
  if(cell.type==='shop'&&cell.shop){
    const soloDisc=act().length===0?0.85:1.0;
    for(let idx=0;idx<cell.shop.length;idx++){
      const s=cell.shop[idx];
      if(!s.sold&&Math.hypot(me.x-s.x,me.y-s.y)<24){
        const isSoloAnkh=(idx===2&&act().length===0&&me.ankh===0);
        const price=Math.max(1,Math.round((isSoloAnkh?24:s.cost)*soloDisc));
        if(me.gold<price){
          FT.push({x:s.x,y:s.y-22,s:`PRECISA DE ${price} MOSCAS!`,c:'#ff5252',l:1.1,b:1});
          snd(140,.14,'sawtooth',.06,-50);
          return;
        }
        me.gold-=price;
        s.sold=true;
        sendE('shop',{gx:wd.gx,gy:wd.gy,idx});
        if(s.t==='hp'){
          me.hp=Math.min(me.mh,me.hp+1);
          FT.push({x:me.x,y:me.y-26,s:'+1 CORAÇÃO COMPRADO!',c:'#ff5252',l:1.2,b:1});
          snd(580,.2,'triangle',.07,260);
        }else if(s.t==='key'){
          me.keys++;
          FT.push({x:me.x,y:me.y-26,s:'+1 CHAVE COMPRADA!',c:'#ffd54f',l:1.2,b:1});
          snd(620,.2,'triangle',.07,300);
        }else if(isSoloAnkh){
          me.ankh=1;
          FT.push({x:me.x,y:me.y-28,s:'OVA DE RENASCIMENTO ATIVA!',c:'#00e676',l:1.6,b:1});
          snd(660,.3,'triangle',.08,420);
        }else{
          got(s.k);
        }
        return;
      }
    }
  }
}

function updCamp(dt){
  TT+=dt;
  spring(me,dt);
  spring(camp.dummy,dt);
  camp.dummy.fl=Math.max(0,camp.dummy.fl-dt);
  me.puff=Math.max(0,me.puff-dt);

  const cut=now()-3000;
  camp.dummy.hits=camp.dummy.hits.filter(h=>h.t>=cut);
  camp.dummy.dps=camp.dummy.hits.reduce((a,b)=>a+b.d,0)/3;

  if(Math.random()<dt*14){
    P.push({x:240+(Math.random()-.5)*14,y:166,vx:(Math.random()-.5)*22,vy:-35-Math.random()*40,l:.8,m:.8,c:Math.random()<.5?'#ffd54f':'#ff6d00',s:2.2,g:-10});
  }

  for(const k in others)if(now()-others[k].t>5500)delete others[k];
  for(const o of Object.values(others)){
    o.rx+=(o.x-o.rx)*.35;o.ry+=(o.y-o.ry)*.35;spring(o,dt);
    if(o.st==='play'&&!isHost()){
      ST='play';enterCell(wd.gx,wd.gy,'');return;
    }
  }

  updatePlayerZAndMove(dt);
  me.x=clamp(me.x,24,W-24);me.y=clamp(me.y,32,H-22);

  for(const b of myB){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    if(Math.hypot(b.x-camp.dummy.x,b.y-camp.dummy.y)<16){
      hitDummy(b.d);
      if(!b.p)b.l=0;
    }
  }
  myB=myB.filter(b=>b.l>0&&b.x>0&&b.x<W&&b.y>0&&b.y<H);
  for(const b of rB){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt}
  rB=rB.filter(b=>b.l>0);
  for(let i=BEAMS.length-1;i>=0;i--){BEAMS[i].l-=dt;if(BEAMS[i].l<=0)BEAMS.splice(i,1)}

  const allPlayers=[me,...act().map(o=>({x:o.rx,y:o.ry}))];
  const inPortal=allPlayers.filter(p=>Math.hypot(p.x-camp.portal.x,p.y-camp.portal.y)<32).length;
  if(inPortal===allPlayers.length&&allPlayers.length>0){
    camp.portal.t+=dt;
    if(camp.portal.t>=0.75&&isHost()){
      camp.portal.t=0;
      sendE('startRun',{bIdx:camp.sign.bIdx,seed:((Math.random()*99999)|0)+1});
    }
  }else camp.portal.t=Math.max(0,camp.portal.t-dt*2);

  sT-=dt;if(sT<=0&&R&&R.connected()){
    sT=1/16;
    R.emit('s',{
      id:me.id,x:me.x|0,y:me.y|0,z:me.z|0,ang:Math.round(me.ang*100)/100,
      hp:me.hp,mh:me.mh,d:0,c:me.ch,w:me.w,puff:+(me.puff>0),j:Math.round(me.j*100)/100,
      fly:me.fly?1:0,sh:me.sh,fam:me.fam,inv:0,wf:me.wf,gold:me.gold,keys:me.keys,revP:0,st:ST
    }).catch(()=>{});
  }
}

function upd(dt,rdt){
  if(paused)return;
  if(ST==='camp'){updCamp(dt);return}
  TT+=dt;
  const key=rmKey();
  if(key!==lastKey){lastKey=key;enterCell(wd.gx,wd.gy,'')}

  if(wd.over&&!prevOver){
    for(let i=0;i<6;i++)setTimeout(()=>pt(60+Math.random()*360,60+Math.random()*110,['#76ff03','#ffd54f','#00e5ff','#ff4081'][i%4],32,165,1.2,3,160),i*170);
    snd(520,.5,'triangle',.1,600);
  }
  prevOver=wd.over;

  for(const k in others)if(now()-others[k].t>5500)delete others[k];
  for(const o of Object.values(others)){
    const sp=Math.hypot(o.x-o.rx,o.y-o.ry);
    o.rx+=(o.x-o.rx)*.35;o.ry+=(o.y-o.ry)*.35;
    if(sp>0.8&&Math.random()<dt*8)dust(o.rx,o.ry+12,'#80cbc4',1);
    spring(o,dt);
  }

  for(const tb of TABLES){tb.fl=Math.max(0,tb.fl-dt);spring(tb,dt)}

  if(isHost())hostUpd(rdt);else for(const b of wd.eb){b.x+=b.vx*dt;b.y+=b.vy*dt}

  for(const e of wd.en){
    const mv=Math.abs((e.x-(e.rx??e.x)));
    e.rx=e.rx==null?e.x:e.rx+(e.x-e.rx)*.4;e.fl-=dt;spring(e,dt);
    if(mv>0.3&&!e.t.startsWith('f')&&Math.random()<dt*5)pt(e.rx,e.y+10,CL[e.t]||'#66bb6a',1,20,.25,1.8);
  }

  for(const pl of POOLS){
    pl.l-=dt;pl.tk-=dt;
    if(pl.tk<=0){
      pl.tk=.35;
      for(const e of wd.en)if(Math.hypot(e.x-pl.x,e.y-pl.y)<RAD[e.t]+pl.r){
        sendE('hit',{i:e.id,d:.8,kx:0,ky:0,by:me.id});e.fl=.06;
      }
    }
  }
  for(let i=POOLS.length-1;i>=0;i--)if(POOLS[i].l<=0)POOLS.splice(i,1);
  for(let i=BEAMS.length-1;i>=0;i--){BEAMS[i].l-=dt;if(BEAMS[i].l<=0)BEAMS.splice(i,1)}

  // Coleta Individual de Moscas de Ouro
  for(let i=FLIES.length-1;i>=0;i--){
    const f=FLIES[i];
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    f.vx*=1-dt*3.5;f.vy*=1-dt*3.5;
    if(f.z>0||f.vz!==0){
      f.vz-=240*dt;f.z+=f.vz*dt;
      if(f.z<=0){f.z=0;f.vz=Math.abs(f.vz)>25?-f.vz*0.45:0}
    }
    f.x=clamp(f.x,M+10,W-M-10);f.y=clamp(f.y,M+10,H-M-10);

    let myDist=me.dead?1e9:Math.hypot(me.x-f.x,me.y-f.y);
    let otDist=1e9;
    for(const o of act())if(!o.d)otDist=Math.min(otDist,Math.hypot(o.rx-f.x,o.ry-f.y));

    if(myDist<otDist&&myDist<44){
      f.x+=(me.x-f.x)*dt*7.5;f.y+=(me.y-f.y)*dt*7.5;
    }
    if(myDist<15){
      me.gold++;
      FT.push({x:f.x,y:f.y-10,s:'+1 MOSCA',c:'#ffd54f',l:.65});
      snd(680+Math.random()*120,.05,'triangle',.04,120);
      FLIES.splice(i,1);
    }else if(otDist<15){
      FLIES.splice(i,1);
    }
  }

  // Coleta de Larvas Cristalizadas Permanentes
  for(let i=LARVAE.length-1;i>=0;i--){
    const lv=LARVAE[i];
    lv.x+=lv.vx*dt;lv.y+=lv.vy*dt;
    lv.vx*=1-dt*3.5;lv.vy*=1-dt*3.5;
    if(lv.z>0||lv.vz!==0){
      lv.vz-=220*dt;lv.z+=lv.vz*dt;
      if(lv.z<=0){lv.z=0;lv.vz=Math.abs(lv.vz)>25?-lv.vz*0.45:0}
    }
    lv.x=clamp(lv.x,M+12,W-M-12);lv.y=clamp(lv.y,M+12,H-M-12);
    const d=me.dead?1e9:Math.hypot(me.x-lv.x,me.y-lv.y);
    if(d<48){lv.x+=(me.x-lv.x)*dt*8;lv.y+=(me.y-lv.y)*dt*8}
    if(d<16){
      addLarvae(1);
      pt(lv.x,lv.y,'#00e5ff',22,110,.55,3);
      FT.push({x:lv.x,y:lv.y-18,s:'+1 LARVA CRISTALIZADA (PERMANENTE)!',c:'#00e5ff',l:1.5,b:1});
      snd(740,.22,'triangle',.08,320);
      LARVAE.splice(i,1);
    }
  }

  for(const b of rB){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    const hitX=b.x<M||b.x>W-M,hitY=b.y<M||b.y>H-M,hitRk=inRock(b.x,b.y);
    if(hitX||hitY||hitRk){
      if(b.bnc>0&&!b.tng){
        b.bnc--;if(hitX)b.vx*=-1;if(hitY||hitRk)b.vy*=-1;
        b.x=clamp(b.x,M+2,W-M-2);b.y=clamp(b.y,M+2,H-M-2);
      }else{
        b.l=0;triggerAoE(b,true);pt(b.x,b.y,b.col||'#76ff03',4,50,.25,2);
      }
    }
  }
  rB=rB.filter(b=>b.l>0);

  spring(me,dt);fl=Math.max(0,fl-dt*2);hint-=rdt;me.puff=Math.max(0,me.puff-dt);
  const cell=curCell();

  // Círculo de Reanimação em Co-op (3.0s)
  if(!me.dead){
    const revSpeed=(achData.coop?1.12:1.0)/3.0;
    for(const o of act()){
      if(o.d){
        if(Math.hypot(me.x-o.rx,me.y-o.ry)<34){
          me.revP=clamp((me.revP||0)+dt*revSpeed,0,1);
          if(me.revP>=1){
            me.revP=0;
            sendE('rev',{target:o.id});
            FT.push({x:o.rx,y:o.ry-26,s:'PARCEIRO REANIMADO!',c:'#00e676',l:1.5,b:1});
            snd(520,.35,'triangle',.09,480);
          }
        }else me.revP=Math.max(0,(me.revP||0)-dt*0.5);
      }
    }
  }

  // Pedais Duplos de Co-op
  if(cell&&cell.type==='combat'&&wd.clear&&act().length>0&&cell.coopChest&&!cell.coopChest.spawned){
    const p1={x:M+44,y:H-M-36},p2={x:W-M-44,y:H-M-36};
    const pls=[me,...act().map(o=>({x:o.rx,y:o.ry}))];
    const on1=pls.some(p=>Math.hypot(p.x-p1.x,p.y-p1.y)<18);
    const on2=pls.some(p=>Math.hypot(p.x-p2.x,p.y-p2.y)<18);
    if(on1&&on2){
      cell.coopChest.spawned=true;
      pt(240,162,'#ffd54f',34,130,.7,3.2);
      FT.push({x:240,y:132,s:'BAÚ COOPERATIVO DESBLOQUEADO!',c:'#ffd54f',l:1.8,b:1});
      snd(540,.35,'triangle',.09,500);
    }
  }

  if(!me.dead){
    updatePlayerZAndMove(dt);

    const dN=wd.clear&&cell?.doors.N&&Math.abs(me.x-240)<20;
    const dS=wd.clear&&cell?.doors.S&&Math.abs(me.x-240)<20;
    const dW=wd.clear&&cell?.doors.W&&Math.abs(me.y-160)<20;
    const dE=wd.clear&&cell?.doors.E&&Math.abs(me.y-160)<20;

    me.x=clamp(me.x,dW?2:M+9,dE?W-2:W-M-9);
    me.y=clamp(me.y,dN?2:M+9,dS?H-2:H-M-9);
    pushOut(me,9);

    if(now()>nextT&&wd.clear){
      let tgx=wd.gx,tgy=wd.gy,dir='';
      if(dN&&me.y<M){tgy--;dir='N'}
      else if(dS&&me.y>H-M){tgy++;dir='S'}
      else if(dW&&me.x<M){tgx--;dir='W'}
      else if(dE&&me.x>W-M){tgx++;dir='E'}
      if(dir){
        const dest=wd.grid[tgy]?.[tgx];
        if(dest){
          if(dest.locked&&me.keys<=0){
            FT.push({x:me.x,y:me.y-20,s:'PORTA TRANCADA (PRECISA DE 1 CHAVE)!',c:'#ff5252',l:1.0,b:1});
            snd(140,.14,'sawtooth',.06,-40);
            me.x=clamp(me.x,M+12,W-M-12);me.y=clamp(me.y,M+12,H-M-12);
          }else{
            if(dest.locked){
              me.keys--;dest.locked=false;
              FT.push({x:me.x,y:me.y-24,s:'USOU 1 CHAVE!',c:'#ffd54f',l:1.2,b:1});
            }
            nextT=now()+850;
            sendE('moveRm',{gx:tgx,gy:tgy,dir});
            snd(260,.3,'sine',.08,380);
          }
        }
      }
    }

    if(wd.trapdoor&&Math.hypot(me.x-240,me.y-135)<20&&now()>nextT){
      nextT=now()+1200;
      sendE('nextBiome',{bIdx:wd.bIdx+1,seed:((Math.random()*99999)|0)+1});
      snd(300,.45,'triangle',.09,520);
    }

    for(let i=DROPS.length-1;i>=0;i--){
      const dr=DROPS[i];spring(dr,dt);
      if(Math.hypot(dr.x-me.x,dr.y-me.y)<18){
        if(dr.t==='key'){
          me.keys++;
          FT.push({x:me.x,y:me.y-22,s:'+1 CHAVE!',c:'#ffd54f',l:1.0,b:1});
          pt(dr.x,dr.y,'#ffd54f',16,90,.45,2.5);snd(620,.2,'triangle',.07,300);
          DROPS.splice(i,1);
        }else if(me.hp<me.mh){
          me.hp=Math.min(me.mh,me.hp+1);
          FT.push({x:me.x,y:me.y-22,s:'+1 CORAÇÃO!',c:'#ff5252',l:1.0,b:1});
          pt(dr.x,dr.y,'#ff5252',16,90,.45,2.5);snd(580,.2,'triangle',.07,260);
          DROPS.splice(i,1);
        }
      }
    }

    me.inv-=dt;
    if(me.inv<=0){
      let hit=false;
      const inAir=me.z>6;
      for(const e of wd.en){
        if(!inAir&&Math.hypot(e.x-me.x,e.y-me.y)<RAD[e.t]*(e.chmp?1.2:1)+7){hit=true;break}
        if(!inAir&&e.seg)for(const sg of e.seg)if(Math.hypot(sg.x-me.x,sg.y-me.y)<18){hit=true;break}
      }
      if(!hit&&!inAir){
        for(const b of wd.eb)if(Math.hypot(b.x-me.x,b.y-me.y)<8){
          hit=true;sendE('ebx',{i:b.id});wd.eb=wd.eb.filter(x=>x!==b);break;
        }
      }
      if(!hit&&!inAir&&!me.fly&&spikesUp()){
        for(const spk of hazards().spikes)if(Math.hypot(spk.x-me.x,spk.y-me.y)<13){hit=true;break}
      }
      if(hit){
        me.inv=1.25;
        if(me.sh>0){
          me.sh--;pt(me.x,me.y,'#40c4ff',22,120,.5,3);snd(700,.2,'triangle',.08,-400);
          FT.push({x:me.x,y:me.y-24,s:'BOLHA BLOQUEOU!',c:'#40c4ff',l:.9});
        }else{
          roomDamaged=true;me.hp--;me.j=.55;fl=1;addShake(9);addHs(.08);
          pt(me.x,me.y,'#ff1744',16,115,.5,3,200);snd(150,.3,'sawtooth',.08,-100);
          if(me.hp<=0){
            if(me.ankh>0&&act().length===0){
              me.ankh=0;me.hp=Math.min(me.mh,3);me.inv=2.0;wd.eb=[];
              pt(me.x,me.y,'#00e676',45,160,.9,3.5);
              FT.push({x:me.x,y:me.y-30,s:'OVA DE RENASCIMENTO ATIVADA!',c:'#00e676',l:2.0,b:1});
              snd(440,.45,'triangle',.1,520);
            }else{
              me.hp=0;me.dead=true;pt(me.x,me.y,'#fff',32,140,.8,3);snd(100,.7,'sawtooth',.09,-60);
            }
          }
        }
      }
    }
  }

  // Projéteis do Jogador + Quebra de Props + Reação Química Co-op
  for(const b of myB){
    if(b.foam)b.r=Math.min(11,b.r+dt*4.5);
    if(b.royal){
      b.trailT-=dt;
      if(b.trailT<=0){b.trailT=.12;POOLS.push({x:b.x,y:b.y,r:14,l:1.4,tk:0,c:'#00ffaa'})}
    }
    // Passar por cima de Poça Ácida energiza o tiro (Reação Química)!
    if(!b.chem&&POOLS.some(pl=>Math.hypot(pl.x-b.x,pl.y-b.y)<pl.r)){
      b.chem=1;b.d*=1.25;b.col='#00e5ff';
    }
    if(b.tng&&hasSyn(me,'hydra')){
      for(const f of FLIES)if(Math.hypot(f.x-b.x,f.y-b.y)<36){f.x=me.x;f.y=me.y}
    }
    if((me.hm||b.shoal)&&!b.tng){
      let n=null,bd=b.shoal?42000:26000;
      for(const e of wd.en){const d=(e.x-b.x)**2+(e.y-b.y)**2;if(d<bd){bd=d;n=e}}
      if(n){
        const s=Math.hypot(b.vx,b.vy),dx=n.x-b.x,dy=n.y-b.y,l=Math.hypot(dx,dy)||1;
        const turn=Math.min(1,dt*(b.shoal?11:6));
        b.vx+=(dx/l*s-b.vx)*turn;b.vy+=(dy/l*s-b.vy)*turn;
      }
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    if(Math.random()<.5)pt(b.x,b.y,b.col||WP[b.w].col,1,14,.25,1.6);

    // Quebrar Barris, Vasos e Caixas com tiros
    for(const pr of PROPS){
      if(!pr.dead&&Math.hypot(pr.x-b.x,pr.y-b.y)<12+b.r){
        breakProp(pr);
        if(!b.p){b.l=0;break}
      }
    }

    const hitX=b.x<M||b.x>W-M,hitY=b.y<M||b.y>H-M,hitRk=!me.fly&&inRock(b.x,b.y);
    if(hitX||hitY||hitRk){
      if(b.bnc>0&&!b.tng){
        b.bnc--;if(hitX)b.vx*=-1;if(hitY||hitRk)b.vy*=-1;
        b.x=clamp(b.x,M+2,W-M-2);b.y=clamp(b.y,M+2,H-M-2);
        triggerAoE(b);snd(340,.04,'triangle',.03,80);
      }else{
        b.l=0;triggerAoE(b);pt(b.x,b.y,b.col||WP[b.w].col,6,70,.3,2);snd(260,.05,'square',.02);
      }
    }
    for(const e of wd.en)if(b.l>0&&!b.hit.includes(e.id)&&Math.hypot(e.x-b.x,e.y-b.y)<RAD[e.t]*(e.chmp?1.2:1)+b.r){
      const kb=(b.tng?18:(b.w==4?14:4.5))*(me.hyper?1.4:1);
      sendE('hit',{i:e.id,d:b.d,kx:Math.cos(b.ka)*kb,ky:Math.sin(b.ka)*kb,by:me.id});
      hitFx(e,b);b.hit.push(e.id);
      if(!b.p){b.l=0;triggerAoE(b)}
    }
  }
  myB=myB.filter(b=>b.l>0);

  sT-=dt;if(sT<=0&&R&&R.connected()){
    sT=1/16;
    R.emit('s',{
      id:me.id,x:me.x|0,y:me.y|0,z:me.z|0,ang:Math.round(me.ang*100)/100,
      hp:me.hp,mh:me.mh,d:me.dead?1:0,c:me.ch,w:me.w,
      puff:+(me.puff>0),j:Math.round(me.j*100)/100,fly:me.fly?1:0,sh:me.sh,fam:me.fam,
      inv:me.inv>0?1:0,wf:me.wf,gold:me.gold,keys:me.keys,revP:Math.round((me.revP||0)*100)/100,
      ic:me.its.length,st:ST
    }).catch(()=>{});
  }
  wT-=dt;if(wT<=0&&R&&R.connected()&&isHost()){
    wT=1/15;
    R.emit('w',{
      h:me.id,st:ST,bIdx:wd.bIdx,fSeed:wd.fSeed,gx:wd.gx,gy:wd.gy,
      c:+wd.clear,o:wd.over,td:+wd.trapdoor,
      en:wd.en.map(e=>[e.id,e.t,e.x|0,e.y|0,e.hp,e.tel>0?1:0,e.chmp||0]),
      eb:wd.eb.map(b=>[b.id,b.x|0,b.y|0,b.vx|0,b.vy|0]),
      shopSold:cell?.shop?cell.shop.map(s=>+s.sold):[],
      chestOpen:cell?.chest?+cell.chest.open:0
    }).catch(()=>{});
  }
}

// **PARTE 3 CONCLUÍDA. Digite CONTINUAR para receber a Parte 4 (Final).**

// =============================================================================
// PARTE 4 (FINAL): EVENTOS DE REDE, COMBO QUÍMICO, TOTEM, UI E RENDERIZADOR 2.5D
// =============================================================================
function handle(t,d){
  if(t=='rs'){reset(false);ST='play';return}
  if(t=='camp'){reset(true);return}
  if(t=='startRun'){
    initFloor(d.bIdx||0,d.seed||12345);
    ST='play';enterCell(2,2,'');lastKey=rmKey();return;
  }
  if(t=='nextBiome'){
    initFloor(d.bIdx||0,d.seed||12345);
    enterCell(2,2,'');lastKey=rmKey();return;
  }
  if(t=='moveRm'){
    const dest=wd.grid[d.gy]?.[d.gx];
    if(dest)dest.locked=false;
    lastKey=`${wd.bIdx}_${d.gx}_${d.gy}_${wd.fSeed}`;
    enterCell(d.gx,d.gy,d.dir||'');return;
  }
  if(t=='flipTb'){
    const tb=TABLES.find(x=>x.id===d.id);
    if(tb&&!tb.flip){tb.flip=true;tb.j=-0.45;tb.v=8}
    return;
  }
  if(t=='totem'){
    const c=wd.grid?.[d.gy]?.[d.gx];
    if(c&&c.totem&&c.totem.state===0){
      c.totem.state=1;
      wd.clear=false;c.clear=false;
      pt(c.totem.x,c.totem.y,'#ff1744',32,130,.7,3.2);
      FT.push({x:240,y:92,s:'CONTRATO DO TOTEM: ONDA DE ELITE!',c:'#ff1744',l:2.0,b:1});
      snd(160,.4,'sawtooth',.09,-60);addShake(8);
      if(isHost()){
        const pl=BIOME_POOLS[wd.bIdx];
        const cnt=3+(act().length>0?1:0);
        for(let i=0;i<cnt;i++){
          const ang=(i/cnt)*6.283;
          const ex=clamp(240+Math.cos(ang)*110,M+28,W-M-28);
          const ey=clamp(160+Math.sin(ang)*70,M+28,H-M-28);
          wd.en.push(E(pl[(i+wd.bIdx)%pl.length],ex,ey,1));
        }
      }
    }
    return;
  }
  if(t=='chemFx'){
    pt(d.x,d.y,'#00e5ff',28,140,.65,3.2);
    pt(d.x,d.y,'#ffd54f',16,110,.5,2.6);
    FT.push({x:d.x,y:d.y-24,s:'COMBO QUÍMICO CO-OP!',c:'#00e5ff',l:1.5,b:1});
    snd(620,.25,'triangle',.08,360);addShake(6);
    return;
  }
  if(t=='rev'){
    if(d.target===me.id&&me.dead){
      me.dead=false;me.hp=2;me.inv=2.0;
      pt(me.x,me.y,'#00e676',35,130,.7,3);snd(520,.35,'triangle',.09,450);
    }
    return;
  }
  if(t=='donate'){
    if(d.to===me.id&&!me.dead){
      me.hp=Math.min(me.mh,me.hp+1);
      FT.push({x:me.x,y:me.y-26,s:'RECEBEU +1 CORAÇÃO!',c:'#ff80ab',l:1.4,b:1});
      snd(580,.25,'triangle',.08,320);
    }
    return;
  }
  if(t=='chest'){
    const c=wd.grid?.[d.gy]?.[d.gx];
    if(c){
      if(d.coop&&c.coopChest)c.coopChest.open=true;
      else if(c.chest)c.chest.open=true;
    }
    return;
  }
  if(t=='shop'){
    const c=wd.grid?.[d.gy]?.[d.gx];
    if(c&&c.shop&&c.shop[d.idx])c.shop[d.idx].sold=true;
    return;
  }
  if(!isHost())return;
  if(t=='hit'){
    const e=wd.en.find(e=>e.id==d.i);
    if(e){
      let dmg=d.d;
      // Ideia A: Reação Química Co-op (Combo quando 2 jogadores diferentes atingem o mesmo alvo)
      if(d.by&&e.chemT>0&&e.chemBy&&e.chemBy!==d.by){
        e.chemT=0;e.chemBy='';
        dmg*=1.8;
        sendE('chemFx',{x:e.x|0,y:e.y|0});
        for(const o of wd.en){
          if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<44)o.hp-=d.d*0.8;
        }
      }else if(d.by){
        e.chemT=1.35;
        e.chemBy=d.by;
      }

      e.hp-=dmg;e.x+=d.kx||0;e.y+=d.ky||0;
      for(let i=wd.en.length-1;i>=0;i--){
        const en=wd.en[i];
        if(en.hp<=0){
          wd.en.splice(i,1);deathFx(en);
          if(en.t=='m')wd.en.push(E('n',en.x-10,en.y),E('n',en.x+10,en.y));
          if(en.t=='bmb'||en.chmp){
            const cnt=en.t=='bmb'?8:6;
            for(let k=0;k<cnt;k++){const a=k*6.283/cnt;shoot(en,Math.cos(a),Math.sin(a),105)}
          }
        }
      }
    }
  }
  else if(t=='ebx')wd.eb=wd.eb.filter(b=>b.id!=d.i);
}

function sendE(t,d){if(R&&R.connected())R.emit(t,d).catch(()=>{});handle(t,d||{})}

function onMsg(t,m){
  const d=m.data;
  if(t=='s'){
    if(m.isMe||!d||d.id==me.id)return;
    const o=others[d.id];
    others[d.id]={...d,rx:o?o.rx:d.x,ry:o?o.ry:d.y,j:d.j??(o?o.j:0),v:o?o.v:0,t:now()};
    return;
  }
  if(t=='w'){
    if(!d||d.h==me.id||isHost())return;
    if(d.fSeed!==wd.fSeed||d.bIdx!==wd.bIdx)initFloor(d.bIdx,d.fSeed);
    if(d.gx!==wd.gx||d.gy!==wd.gy){
      lastKey=`${d.bIdx}_${d.gx}_${d.gy}_${d.fSeed}`;
      enterCell(d.gx,d.gy,'');
    }
    const old=Object.fromEntries(wd.en.map(e=>[e.id,e])),ids=new Set(d.en.map(a=>a[0]));
    for(const id in old)if(!ids.has(+id)&&!wd.over)deathFx(old[id]);
    wd.clear=!!d.c;wd.over=d.o||'';wd.trapdoor=!!d.td;
    const cell=curCell();
    if(cell){
      cell.clear=wd.clear;
      if(cell.shop&&d.shopSold)d.shopSold.forEach((v,i)=>{if(cell.shop[i])cell.shop[i].sold=!!v});
      if(cell.chest&&d.chestOpen)cell.chest.open=true;
    }
    wd.en=d.en.map(a=>{
      const o=old[a[0]]||{};
      const chmp=a[6]||0;
      const baseMh=Math.round((HP[a[1]]||200)*(a[1].startsWith('B')?1:(1+wd.bIdx*0.22))*(chmp?1.5:1));
      return{
        id:a[0],t:a[1],x:a[2],y:a[3],hp:a[4],mh:o.mh||baseMh,tel:a[5],chmp,
        rx:o.rx??a[2],j:o.j||0,v:o.v||0,fl:o.fl||0,
        seg:o.seg||(a[1]=='B2'?Array.from({length:6},()=>({x:a[2],y:a[3]})):null)
      };
    });
    wd.eb=d.eb.map(a=>({id:a[0],x:a[1],y:a[2],vx:a[3],vy:a[4]}));
    return;
  }
  if(t=='sh'){
    if(!m.isMe&&d){
      if(d.beam){
        BEAMS.push({x:d.x,y:d.y,a:d.a,col:d.col||'#e040fb',l:.22,m:.22,w:d.bw||6});
        snd(140,.09,'sawtooth',.03,-100);
      }else{
        rB.push({
          x:d.x,y:d.y,ox:d.x,oy:d.y,vx:d.vx,vy:d.vy,
          r:d.r||4,w:d.w||0,l:d.l||.95,
          tng:d.tng||0,oid:d.oid,aoe:d.aoe||0,pool:d.pool||0,bnc:d.bnc||0,col:d.col
        });
      }
    }
    return;
  }
  handle(t,d||{});
}

function makeBars(val,max=5,gold=false){
  let s='<span class="stat-bars">';
  for(let i=0;i<max;i++)s+=`<i class="${i<val?'on'+(gold?' gold':''):''}"></i>`;
  return s+'</span>';

function renderCarousel(){
  const box=$('carousel');if(!box)return;
  box.innerHTML='';
  const N=CH.length;
  CH.forEach((c,i)=>{
    let diff=i-ch;
    if(diff>N/2)diff-=N;
    if(diff<-N/2)diff+=N;
    const ang=diff*(Math.PI*2/N);
    const rx=Math.sin(ang)*8.8;
    const ry=Math.cos(ang)*2.1;
    const sc=.56+(Math.cos(ang)+1)*.34;
    const z=Math.round(sc*100);
    const unlocked=isCharUnlocked(i);

    const slot=document.createElement('div');
    slot.className='frog-slot'+(i===ch?' active':'');
    slot.style.transform=`translate(calc(-50% + ${rx}em), calc(-50% + ${ry}em)) scale(${sc})`;
    slot.style.zIndex=z;
    slot.style.opacity=unlocked?(0.45+sc*0.55):0.65;

    const k=document.createElement('canvas');
    const spSrc=unlocked?S.pIdle[i]:sil(S.pIdle[i],'#16241b');
    k.width=spSrc.width;k.height=spSrc.height;
    k.style.width='4.2em';
    const kx=k.getContext('2d');kx.imageSmoothingEnabled=false;
    kx.drawImage(spSrc,0,0);
    if(!unlocked)kx.drawImage(S.lock,k.width/2-S.lock.width/2,k.height/2-S.lock.height/2);

    const ped=document.createElement('div');ped.className='slot-ped';
    slot.append(k,ped);
    slot.onclick=()=>selectFrog(i);
    box.append(slot);
  });

  const cur=CH[ch],unlocked=isCharUnlocked(ch);
  const u=achStats.upg||{hp:0,dm:0,sp:0};
  $('ci-name').textContent=unlocked?cur.n:`??? (${cur.n})`;
  $('ci-title').textContent=cur.t;
  $('ci-wp').textContent=WP[cur.wp].nm;
  const affNames=cur.aff.slice(0,3).map(idx=>IT[idx][0]).join(', ');
  $('ci-pas').textContent=`${cur.pas} · Afinidade: ${affNames}`;

  const hpBar=clamp(Math.round((cur.hp+u.hp)/2),1,5);
  const dmBar=clamp(Math.round(cur.dm*(1+u.dm*0.12)*1.5),1,5);
  const rtBar=clamp(Math.round((0.5-cur.rt)*16),1,5);
  const spBar=clamp(Math.round((cur.sp*(1+u.sp*0.06)-65)/14),1,5);
  $('ci-stats').innerHTML=`
    <div class="stat-item"><span>VIDA</span>${makeBars(hpBar,5)}</div>
    <div class="stat-item"><span>DANO</span>${makeBars(dmBar,5,true)}</div>
    <div class="stat-item"><span>CADÊNCIA</span>${makeBars(rtBar,5)}</div>
    <div class="stat-item"><span>VELOC.</span>${makeBars(spBar,5)}</div>
  `;
  const lk=$('ci-lock');
  if(!unlocked){
    lk.style.display='block';lk.textContent='BLOQUEADO — '+cur.reqTxt;
    $('solo').disabled=true;$('go').disabled=true;
  }else{
    lk.style.display='none';
    $('solo').disabled=false;$('go').disabled=false;
  }
  if($('menu-larva-cnt'))$('menu-larva-cnt').textContent=achStats.larvae||0;
}
